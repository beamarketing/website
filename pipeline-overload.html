    font-family:'PS2P',ui-monospace,Menlo,Consolas,monospace;
    display:flex; align-items:center; justify-content:center;
    padding:14px 14px 30px; overflow:hidden; touch-action:none;
    background:radial-gradient(ellipse at 50% 0%, #0a1712 0%, #05070a 68%);
  }
  #wrap{position:relative; width:100%; max-width:1280px; aspect-ratio:16/9;}
  canvas{
    width:100%; height:100%; display:block; border-radius:6px;
    box-shadow:0 0 0 2px #14231b, 0 0 60px rgba(87,224,138,.14), 0 24px 60px rgba(0,0,0,.6);
    background:#05060c; cursor:pointer; touch-action:none;
  }
  #ov{position:absolute; inset:0; display:none; align-items:center; justify-content:center;
      background:rgba(5,8,10,.92); padding:3%; border-radius:6px; backdrop-filter:blur(3px);}
  #ov.on{display:flex}
  .panel{
    width:min(620px,100%); background:linear-gradient(180deg,#111a17,#0a0f10);
    border:2px solid var(--grn); border-radius:6px;
    box-shadow:0 0 40px rgba(87,224,138,.18), inset 0 1px 0 rgba(255,255,255,.06);
    padding:24px 24px 18px; font-size:11px; line-height:1.9; max-height:100%; overflow:auto;
  }
  .panel h2{margin:0 0 8px; font-size:13px; color:var(--grn); letter-spacing:1px; line-height:1.6;
            text-shadow:0 0 14px rgba(87,224,138,.6)}
  .panel .sub{color:var(--dim); font-size:9px; margin:0 0 18px; line-height:2}
  .fld{margin-bottom:11px}
  .fld label{display:block; font-size:8px; color:var(--dim); margin-bottom:6px; letter-spacing:.5px}
  .fld input,.fld select{
    width:100%; background:#070c0a; color:var(--wht); border:1px solid #26303a;
    padding:11px 9px; font-family:inherit; font-size:10px; outline:none; border-radius:3px;
  }
  .fld input:focus,.fld select:focus{border-color:var(--grn); box-shadow:0 0 0 2px rgba(87,224,138,.2)}
  .row{display:flex; gap:12px}
  .row>*{flex:1; min-width:0}
  .btn{
    display:block; width:100%; margin-top:6px; cursor:pointer; border-radius:2px;
    background:linear-gradient(180deg,#6ff0a2,#3fbd72); color:#04210f; border:0;
    border-bottom:3px solid #2a8a52; padding:14px 10px; font-family:inherit; font-size:11px;
    letter-spacing:1px; text-shadow:0 1px 0 rgba(255,255,255,.25);
  }
  .btn:hover{filter:brightness(1.1)}
  .btn:active{transform:translateY(2px); border-bottom-width:1px}
  .btn.ghost{background:none; color:var(--dim); border:1px solid #2b3350; border-bottom:1px solid #2b3350;
             font-size:8px; padding:10px; margin-top:10px; text-shadow:none}
  .btn.ghost:hover{color:var(--wht); border-color:var(--dim)}
  .err{color:var(--red); font-size:8px; min-height:15px; margin:0 0 4px}
  .kv{color:var(--dim); font-size:8px; line-height:2.1; margin:0 0 16px}
  .kv b{color:var(--wht)}
  #hint{position:absolute; left:0; right:0; bottom:-22px; text-align:center;
        font-size:8px; color:#4a5375; line-height:1.6}
  @media (max-width:640px){ .panel{font-size:9px; padding:16px} .row{flex-direction:column; gap:0} }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c" width="960" height="540"></canvas>

  <div id="ov">
    <div class="panel" id="p-form">
      <h2>FIND YOUR ML-SAFE RANGE</h2>
      <p class="sub">
        Tell us a little about your dataset and we'll help you evaluate the
        impact on your own video and models.
      </p>
      <div class="fld"><label>NAME</label><input id="f-name" autocomplete="name" placeholder="Jane Doe"></div>
      <div class="row">
        <div class="fld"><label>WORK EMAIL</label><input id="f-mail" type="email" autocomplete="email" placeholder="jane@fleet.ai"></div>
        <div class="fld"><label>COMPANY</label><input id="f-co" autocomplete="organization" placeholder="Fleet AI"></div>
      </div>
      <div class="row">
        <div class="fld"><label>DATA VOLUME</label>
          <select id="f-vol"><option>&lt; 10 TB</option><option>10 - 100 TB</option>
          <option>100 TB - 1 PB</option><option>&gt; 1 PB</option><option>Not sure yet</option></select>
        </div>
        <div class="fld"><label>MAIN DATA CONSTRAINT</label>
          <select id="f-constraint"><option>Storage</option><option>Upload / network</option>
          <option>Cloud ingest</option><option>Training throughput</option>
          <option>Model impact</option><option>Not sure yet</option></select>
        </div>
      </div>
      <div class="err" id="f-err"></div>
      <button class="btn" id="f-go">START MY BLUEPRINT AV EVALUATION &rarr;</button>
      <button class="btn ghost" id="f-skip">No thanks — back to title</button>
    </div>

    <div class="panel" id="p-thanks" style="display:none">
      <h2>TEST YOUR VIDEO WITH BLUEPRINT AV</h2>
      <p class="sub">Evaluate Beamr encoding against your own video and models.</p>
      <p class="kv" id="t-recap"></p>
      <button class="btn" id="t-blueprint">FIND MY ML-SAFE RANGE &rarr;</button>
      <button class="btn ghost" id="t-go">Run the ML-safe replay</button>
      <button class="btn ghost" id="t-replay">Play again</button>
    </div>
  </div>
  <div id="hint">A / D&nbsp; STEER &nbsp;·&nbsp; W / S&nbsp; SPEED &nbsp;·&nbsp; SPACE&nbsp; CONFIRM &nbsp;·&nbsp; M&nbsp; MUTE</div>
</div>

<script>
/* =====================================================================
   PIPELINE OVERLOAD — The AV Data Pressure Test
   A pseudo-3D arcade run about autonomous-fleet video data.
   Single file, no build step, no external assets, no storage APIs.

   The story: as AV programs add cameras, resolution, vehicles and
   recording hours, video grows faster than the pipeline around it. The
   question is not whether to reduce the data — it is how to reduce it
   without materially changing model behavior.

   >>> HUBSPOT: set HUBSPOT_PORTAL_ID + HUBSPOT_FORM_GUID and submissions
       POST to HubSpot's Forms API (no HubSpot JS needed, CORS-enabled).
       The field internal names the game sends are listed in HS_FIELDS
       below — create matching contact properties in HubSpot. Leave the
       IDs "" to skip HubSpot and stay client-side.
   >>> LEADS: LEAD_ENDPOINT is an optional extra JSON POST target
       (Formspree / Zapier / your own /api/lead). Independent of HubSpot.
       Every submission also lands in window.__LEADS.
   >>> BLUEPRINT_URL: destination for the "Explore your ML-safe range"
       CTA on the result screen. Leave "" to keep it inert.
   >>> MLSAFE_REDUCTION: illustrative benchmark reduction used for the
       personalized result and the ML-safe replay. 0.50 == 50% less data.
   >>> COPY: player-facing text lives in SENSORS, PRESSURE, CONSTRAINTS,
       DATA_LABELS, LOAD_ALERTS, OVERS and the scr* screen functions.
   ===================================================================== */
const HUBSPOT_PORTAL_ID = "";    // e.g. "1234567"  (HubSpot account/portal id)
const HUBSPOT_FORM_GUID = "";    // e.g. "a1b2c3d4-...."  (the form's GUID)
const LEAD_ENDPOINT = "";
const BLUEPRINT_URL = "";
const MLSAFE_REDUCTION = 0.50;   // illustrative Beamr AV benchmark scenario

const W = 960, H = 540;
const cv  = document.getElementById('c');
const ctx = cv.getContext('2d');

/* ---------- palette ---------- */
/* One cohesive system: Beamr green (positive) + one warm danger + neutral
   type. Legacy colour keys are repointed into this reduced palette so the
   whole game reads in three families, never a rainbow. */
const C = {
  grn:'#57e08a', grnD:'#2c7c4b',
  warn:'#ff7a45', warnD:'#a2481f',
  red:'#ff6a4d',  redD:'#8d2f22',
  wht:'#eef2ff', dim:'#98a2bd', dim2:'#5a6480', ink:'#05060c',
  cyan:'#57e08a', cyanD:'#2c7c4b',   // → green (positive accent)
  mag:'#ff7a45',  magD:'#a2481f',    // → warm danger
  yel:'#ff7a45',  yelD:'#a2481f',    // → warm danger
  violet:'#98a2bd'                   // → neutral
};

/* ---------- tiny helpers ---------- */
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,p)=>a+(b-a)*p;
const rnd=(a,b)=>a+Math.random()*(b-a);
const blink=(ms)=>Math.floor(performance.now()/(ms||400))%2===0;
function txt(s,x,y,col,size,align,glow){
  ctx.font=(size||16)+"px PS2P, ui-monospace, monospace";
  ctx.textAlign=align||'left'; ctx.textBaseline='alphabetic';
  if(glow){ ctx.shadowColor=glow; ctx.shadowBlur=size*0.9; }
  ctx.fillStyle=col||C.wht; ctx.fillText(s,x,y);
  ctx.shadowBlur=0;
}
const txtC=(s,y,col,size,glow)=>txt(s,W/2,y,col,size,'center',glow);
function rr(x,y,w,h,r){
  r=Math.min(r,w/2,h/2);
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y); ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r); ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h); ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r); ctx.quadraticCurveTo(x,y,x+r,y); ctx.closePath();
}
function grad(x0,y0,x1,y1,stops){
  const g=ctx.createLinearGradient(x0,y0,x1,y1);
  stops.forEach(s=>g.addColorStop(s[0],s[1])); return g;
}
/* format a data figure (MB in) as MB / GB / TB, keeping enough precision
   that small runs don't round away to a meaningless number */
function fmtData(mb){
  const unit=(v,u)=>{
    const d = v>=100?0 : v>=10?1 : 2;
    return (+v.toFixed(d)).toString()+' '+u;
  };
  if(mb>=1048576) return unit(mb/1048576,'TB');
  if(mb>=1024)    return unit(mb/1024,'GB');
  return unit(mb,'MB');
}

/* =====================================================================
   AUDIO — one context for a procedural synthwave score plus SFX
   ===================================================================== */
const AUDIO = (()=>{
  let ac=null, master=null, musicG=null, sfxG=null, delay=null, noise=null;
  let running=false, tickTimer=null, step=0, nextT=0;
  let mode='menu', intensity=0, target=0;
  const BPM=126, STEP=(60/BPM)/4;
  const mid=(m)=>440*Math.pow(2,(m-69)/12);
  /* Am - F - C - G  (bar per chord) */
  const MINOR=[{r:45,c:[57,60,64]},{r:41,c:[53,57,60]},{r:48,c:[55,60,64]},{r:43,c:[50,55,59]}];
  /* C - G - Am - F : brighter, used by ml-safe mode */
  const MAJOR=[{r:48,c:[55,60,64]},{r:43,c:[55,59,62]},{r:45,c:[57,60,64]},{r:41,c:[53,57,60]}];

  function ensure(){
    if(ac) return ac;
    try{ ac=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return null; }
    master=ac.createGain(); master.gain.value=0.9; master.connect(ac.destination);
    musicG=ac.createGain(); musicG.gain.value=0.0; musicG.connect(master);
    sfxG  =ac.createGain(); sfxG.gain.value=0.9;  sfxG.connect(master);
    delay=ac.createDelay(1.0); delay.delayTime.value=STEP*3;
    const fb=ac.createGain(); fb.gain.value=0.28;
    const dw=ac.createGain(); dw.gain.value=0.32;
    delay.connect(fb); fb.connect(delay); delay.connect(dw); dw.connect(musicG);
    /* reusable noise */
    noise=ac.createBuffer(1, ac.sampleRate*0.5, ac.sampleRate);
    const d=noise.getChannelData(0);
    for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
    return ac;
  }
  function env(node,t,a,d,peak){
    const g=ac.createGain(); g.gain.setValueAtTime(0.0001,t);
    g.gain.linearRampToValueAtTime(peak,t+a);
    g.gain.exponentialRampToValueAtTime(0.0001,t+a+d);
    node.connect(g); return g;
  }
  function tone(t,freq,dur,type,peak,dest,detune){
    const o=ac.createOscillator(); o.type=type||'sawtooth'; o.frequency.value=freq;
    if(detune) o.detune.value=detune;
    const g=env(o,t,0.008,dur,peak); g.connect(dest||musicG);
    o.start(t); o.stop(t+dur+0.05);
    return o;
  }
  function hit(t,freq,dur,peak,hp){
    const s=ac.createBufferSource(); s.buffer=noise;
    const f=ac.createBiquadFilter(); f.type=hp?'highpass':'bandpass';
    f.frequency.value=freq; f.Q.value=hp?0.7:1.4;
    s.connect(f); const g=env(f,t,0.002,dur,peak); g.connect(musicG);
    s.start(t); s.stop(t+dur+0.05);
  }
  function kick(t){
    const o=ac.createOscillator(); o.type='sine';
    o.frequency.setValueAtTime(150,t); o.frequency.exponentialRampToValueAtTime(42,t+0.13);
    const g=env(o,t,0.004,0.20,0.85); g.connect(musicG);
    o.start(t); o.stop(t+0.3);
  }
  function bassNote(t,m,dur,cut){
    const o=ac.createOscillator(); o.type='sawtooth'; o.frequency.value=mid(m);
    const o2=ac.createOscillator(); o2.type='square'; o2.frequency.value=mid(m-12);
    const f=ac.createBiquadFilter(); f.type='lowpass'; f.Q.value=7;
    f.frequency.setValueAtTime(cut*1.5,t);
    f.frequency.exponentialRampToValueAtTime(cut*0.6,t+dur);
    o.connect(f); o2.connect(f);
    const g=env(f,t,0.01,dur,0.34); g.connect(musicG);
    o.start(t); o2.start(t); o.stop(t+dur+0.05); o2.stop(t+dur+0.05);
  }
  function pad(t,chord,dur,bright){
    chord.forEach((m,i)=>{
      [-7,7].forEach(dt=>{
        const o=ac.createOscillator(); o.type='sawtooth';
        o.frequency.value=mid(m+(bright?12:0)); o.detune.value=dt;
        const f=ac.createBiquadFilter(); f.type='lowpass'; f.frequency.value=bright?2600:1500;
        o.connect(f);
        const g=ac.createGain(); g.gain.setValueAtTime(0.0001,t);
        g.gain.linearRampToValueAtTime(0.055,t+0.5);
        g.gain.setValueAtTime(0.055,t+dur*0.7);
        g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
        f.connect(g); g.connect(musicG);
        o.start(t); o.stop(t+dur+0.1);
      });
    });
  }
  function siren(t){
    const o=ac.createOscillator(); o.type='sawtooth';
    o.frequency.setValueAtTime(300,t);
    o.frequency.linearRampToValueAtTime(720,t+0.7);
    o.frequency.linearRampToValueAtTime(300,t+1.4);
    const f=ac.createBiquadFilter(); f.type='lowpass'; f.frequency.value=1400;
    o.connect(f); const g=env(f,t,0.05,1.4,0.16); g.connect(musicG);
    o.start(t); o.stop(t+1.6);
  }

  /* --- the sequencer --- */
  function schedule(){
    if(!ac||!running) return;
    const look=ac.currentTime+0.16;
    while(nextT<look){
      const t=nextT, s=step&15, bar=(step>>4)&3;
      const prog=(mode==='mlsafe')?MAJOR:MINOR;
      const ch=prog[bar];
      const I=intensity;
      const cut=lerp(520,4200,I);

      if(mode==='crisis'){
        if(s===0) siren(t);
        if(s%4===0) bassNote(t,33,STEP*3.6,300);
      } else if(mode==='over'){
        if(s===0) pad(t,[45,48,52],STEP*15,false);
      } else {
        /* pad on every bar */
        if(s===0) pad(t,ch.c,STEP*15.5, mode==='mlsafe');
        /* bass */
        if(mode!=='menu'){
          if(s%2===0) bassNote(t, ch.r + (s===10||s===11?12:0), STEP*1.7, cut);
        } else if(s===0||s===8) bassNote(t,ch.r,STEP*7,700);
        /* drums */
        if(mode!=='menu'){
          if(s===0||s===8||(I>0.5&&s===14)) kick(t);
          if(s===4||s===12) hit(t,1500,0.13,0.24,false);
          if(I>0.15 && s%2===0) hit(t,7000,0.03,0.10,true);
          if(I>0.6  && s%2===1) hit(t,9000,0.02,0.055,true);
        }
        /* arpeggio */
        if(I>0.28 || mode==='mlsafe'){
          const seq=[0,1,2,1,2,0,1,2,2,1,0,1,2,0,1,2];
          const m=ch.c[seq[s]%3]+12;
          tone(t,mid(m),STEP*0.9,'square',0.075,delay);
        }
        /* lead stabs when things get hairy */
        if(I>0.66 && (s===6||s===13)) tone(t,mid(ch.c[2]+12),STEP*1.6,'sawtooth',0.07);
      }
      nextT+=STEP; step++;
    }
    /* glide music level + intensity */
    intensity += (target-intensity)*0.06;
  }

  return {
    ensure,
    get ctx(){ return ac; },
    start(){
      if(!ensure()) return;
      if(ac.state==='suspended') ac.resume();
      if(running) return;
      running=true; step=0; nextT=ac.currentTime+0.08;
      musicG.gain.cancelScheduledValues(ac.currentTime);
      musicG.gain.linearRampToValueAtTime(0.85, ac.currentTime+1.2);
      tickTimer=setInterval(schedule,25);
    },
    setMode(m){
      if(!ac) return;
      if(m!==mode){ mode=m; step=0; nextT=Math.max(nextT,ac.currentTime+0.03); }
    },
    setIntensity(v){ target=clamp(v,0,1); },
    duck(){ if(!ac) return; musicG.gain.cancelScheduledValues(ac.currentTime);
            musicG.gain.setValueAtTime(0.3,ac.currentTime);
            musicG.gain.linearRampToValueAtTime(0.85,ac.currentTime+0.5); },
    mute(on){ if(!ac) return; master.gain.value = on?0:0.9; },
    get info(){ return {running, mode, intensity:+intensity.toFixed(2), step}; },
    get bus(){ return master; },
    /* --- sfx --- */
    blip(f,d,type,vol,slide){
      if(!ensure()) return;
      if(ac.state==='suspended') ac.resume();
      const t=ac.currentTime;
      const o=ac.createOscillator(); o.type=type||'square'; o.frequency.setValueAtTime(f,t);
      if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(30,slide),t+d);
      const g=ac.createGain(); g.gain.setValueAtTime(vol==null?0.09:vol,t);
      g.gain.exponentialRampToValueAtTime(0.0001,t+d);
      o.connect(g); g.connect(sfxG); o.start(t); o.stop(t+d+0.02);
    },
    crash(){
      if(!ensure()) return;
      const t=ac.currentTime;
      const s=ac.createBufferSource(); s.buffer=noise;
      const f=ac.createBiquadFilter(); f.type='lowpass';
      f.frequency.setValueAtTime(2600,t); f.frequency.exponentialRampToValueAtTime(180,t+0.45);
      const g=ac.createGain(); g.gain.setValueAtTime(0.5,t);
      g.gain.exponentialRampToValueAtTime(0.0001,t+0.5);
      s.connect(f); f.connect(g); g.connect(sfxG); s.start(t); s.stop(t+0.55);
    }
  };
})();
let muted=false;
const sfx={
  ui:   ()=>AUDIO.blip(760,0.05,'square',0.05),
  grab: ()=>{AUDIO.blip(1320,0.045,'square',0.05); setTimeout(()=>AUDIO.blip(1980,0.05,'square',0.04),40);},
  combo:(n)=>AUDIO.blip(880+n*110,0.09,'square',0.06,1760+n*110),
  near: ()=>AUDIO.blip(2400,0.05,'sine',0.05,1200),
  big:  ()=>{AUDIO.crash(); AUDIO.blip(90,0.3,'sawtooth',0.12,40); AUDIO.duck();},
  wall: ()=>{AUDIO.crash(); AUDIO.blip(70,0.4,'square',0.12); AUDIO.duck();},
  tier: ()=>{[660,880,1100].forEach((f,i)=>setTimeout(()=>AUDIO.blip(f,0.09,'square',0.05),i*70));},
  alert:()=>AUDIO.blip(420,0.09,'triangle',0.06),
  dead: ()=>{AUDIO.crash(); [320,250,190,140].forEach((f,i)=>setTimeout(()=>AUDIO.blip(f,0.3,'sawtooth',0.1),i*150));},
  win:  ()=>{[523,659,784,1047].forEach((f,i)=>setTimeout(()=>AUDIO.blip(f,0.18,'square',0.06),i*110));}
};

/* =====================================================================
   TUNING
   ===================================================================== */
const RAMP    = 95;            // seconds to maximum pressure
const SPDZ    = [0.78,1.75];   // road speed in z-units/sec
const ROADW   = [352,196];     // road half-width at the camera, px
const CARU    = [0.19,0.32];   // car width in road units, grows with sensors
const PASSIVE = [0.85,3.3];    // load/sec just from recording
const FLOOR   = [0,45];        // load the fleet can no longer go under
const SPAWN   = [0.62,0.28];   // seconds between spawns
const RELIEF  = 3.0;           // load removed per clean video capture
const HIT_WALL = 15;           // clipping a pipeline constraint
const CARACC  = 3.4, CARMAX = 1.15, CARFRI = 7;   // in road units/sec
const NEAR    = 0.055;         // near-miss window in road units

/* The fleet still scales up under the hood (car width / difficulty), but the
   player only ever feels it as brief world events, never a HUD dashboard. */
const SENSORS=['2x CAM','+4 CAMERAS','12MP CAMERAS','4K CAPTURE','60 FPS','MORE ROAD HOURS','FLEET x100'];
const TIER_EVENTS=[
  {a:'FLEET EXPANDS',    b:'+4 CAMERAS'},
  {a:'12MP CAMERAS',     b:'DATA RATE ↑'},
  {a:'4K CAPTURE',       b:'MORE VIDEO'},
  {a:'60 FPS',           b:'DATA RATE ↑'},
  {a:'MORE ROAD HOURS',  b:'MORE VIDEO'},
  {a:'FLEET ×100',       b:'DATA RATE ↑↑'}
];

/* DATA PRESSURE — arcade hazards, each a reason the video volume explodes. */
const PRESSURE=[
  {tag:'+4 CAMERAS',  icon:'cam',    load:10},
  {tag:'12MP',        icon:'cam',    load:12},
  {tag:'4K',          icon:'film',   load:14},
  {tag:'60 FPS',      icon:'fps',    load:11},
  {tag:'MORE HOURS',  icon:'clock',  load:12},
  {tag:'FLEET ×10',   icon:'fleet',  load:15},
  {tag:'FLEET ×100',  icon:'fleet',  load:20},
  {tag:'RAW VIDEO',   icon:'film',   load:15},
  {tag:'MULTI-CAM',   icon:'cam',    load:13}
];

/* The pipeline getting tighter as data grows — one universal idea, with the
   odd contextual label as light flavour. */
const CONSTRAINTS=['PIPELINE BOTTLENECK','PIPELINE BOTTLENECK','PIPELINE BOTTLENECK','STORAGE','UPLOAD','TRAINING'];

/* Three escalating, cinematic alerts — nothing more. */
const LOAD_ALERTS=[
  {at:55,s:'PIPELINE PRESSURE RISING',        c:C.warn},
  {at:75,s:'DATA IS OUTGROWING THE PIPELINE', c:C.warn},
  {at:90,s:'PIPELINE OVERLOAD',               c:C.red}
];

/* ---------- projection ---------- */
const HUD_H=74, STRIP_Y=486, HZ=196, RBOT=486, DEPTH=2.55, CX=W/2;
const CAR_Z=0.05, ZSPAWN=2.3;
const sOf=(z)=>1/(1+Math.max(0,z)*DEPTH);
const yOf=(z)=>HZ+(RBOT-HZ)*sOf(z);
const cOf=(z)=>S.curve*190*(1-sOf(z));
function xOf(u,z,s){ s=s||sOf(z); return CX+cOf(z)+u*roadW()*s; }
const pxw=(uw,s)=>uw*2*roadW()*s;   /* on-screen width == collision width */

/* =====================================================================
   STATE
   ===================================================================== */
let S=null, App={st:'title',tT:0,best:0,bestCombo:0,lastRun:null};
const keys={};

function newGame(mlsafe){
  S={
    st: mlsafe?'mlsafe':'play', mlsafe:!!mlsafe,
    t:0, tier:0, tierT:0, spawnT:0.5, neckT:2.6, dist:0, curve:0, curveT:0,
    car:{u:0,vu:0,uw:CARU[0]/2,bank:0,spd:1,pitch:0},
    obj:[], parts:[], pops:[], rings:[], props:[],
    load: mlsafe?16:0, maxLoad:mlsafe?16:0, loadShown:mlsafe?16:0, loadPulse:0, loadPulseC:'#ff5647',
    mb:0, grabbed:0, hits:0, pressureHits:0, pressureGB:0, combo:0, mult:1, bestCombo:0, nears:0,
    alertsFired:[],
    note:null, noteT:0, big:null, bigT:0, tut:{}, shake:0, flash:0, flashC:'#fff', alertT:0,
    choice:0, over:null, revealT:0, resultT:0, comboPulse:0
  };
  for(let side=-1;side<=1;side+=2)
    for(let i=0;i<22;i++)
      S.props.push({side, z:0.06+i*0.11+rnd(-0.02,0.02), k:(Math.random()*100)|0, u:1.28+rnd(0,0.5)});
  if(mlsafe) note('ML-SAFE ENCODING ON — DATA PRESSURE HALVED', C.grn, 3.4);
}
function note(s,c,d){ S.note={s,c:c||C.wht}; S.noteT=d||1.7; }
/* brief, bold, cinematic world event (fleet growth / escalating alert) */
function bigEvent(a,b,c,d){ S.big={a,b:b||'',c:c||C.wht}; S.bigT=d||1.6; }
function tutOnce(key,s,c,d){ if(S.tut[key]) return; S.tut[key]=1; note(s,c||C.grn,d||2.2); }

const prog=()=>clamp(S.t/RAMP,0,1);
const val=(r)=>lerp(r[0],r[1],prog());
const THROTTLE=[0.55,1.7];      // player speed multiplier: brake .. accelerate
const speed=()=>val(SPDZ)*(S.mlsafe?1.12:1)*(S&&S.car?S.car.spd:1);
const roadW=()=>S.mlsafe?lerp(ROADW[0],ROADW[1],prog()*0.3):val(ROADW);
const floorLoad=()=>S.mlsafe?12:val(FLOOR);

/* =====================================================================
   UPDATE
   ===================================================================== */
function update(dt){
  if(App.st==='title'){ App.tT+=dt; AUDIO.setIntensity(0.12); return; }
  if(S.st==='reveal'){ S.revealT+=dt; return; }
  if(S.st==='result'){ S.resultT+=dt; if(S.shake>0) S.shake=Math.max(0,S.shake-dt*8); return; }
  if(S.st==='choice'||S.st==='over'){
    if(S.shake>0) S.shake=Math.max(0,S.shake-dt*8);
    return;
  }
  if(S.st!=='play'&&S.st!=='mlsafe') return;

  S.t+=dt;
  const sp=speed(), p=prog();
  S.dist+=sp*dt;
  AUDIO.setIntensity(S.mlsafe?0.55:clamp(0.22+p*0.7+(S.load/100)*0.15,0,1));

  /* lazy S-bend */
  S.curveT+=dt;
  S.curve=Math.sin(S.curveT*0.17)*0.62+Math.sin(S.curveT*0.41)*0.24;

  /* first-seconds tutorial, taught in the world (not on a screen) */
  if(!S.mlsafe){
    tutOnce('collect','COLLECT VIDEO',C.grn,2.4);
    if(S.load>=18) tutOnce('load','PIPELINE LOAD ↑',C.warn,2.0);
  }

  /* the fleet scales up — felt as brief world events, not a HUD dashboard */
  S.tierT+=dt;
  if(S.tierT>=RAMP/7 && S.tier<SENSORS.length-1){
    S.tierT=0; S.tier++;
    S.car.uw=lerp(CARU[0],CARU[1],S.tier/(SENSORS.length-1))/2;
    const ev=TIER_EVENTS[Math.min(S.tier-1,TIER_EVENTS.length-1)];
    bigEvent(ev.a,ev.b,C.grn,1.8);
    S.flash=0.4; S.flashC='rgba(87,224,138,.9)'; sfx.tier();
  }

  /* steering */
  const dir=(keys.left?-1:0)+(keys.right?1:0);
  if(dir) S.car.vu+=dir*CARACC*dt;
  S.car.vu-=S.car.vu*Math.min(1,CARFRI*dt);
  S.car.vu=clamp(S.car.vu,-CARMAX,CARMAX);
  S.car.u+=S.car.vu*dt;
  const lim=1-S.car.uw-0.02;
  if(S.car.u<-lim){ S.car.u=-lim; S.car.vu*=-0.3; }
  if(S.car.u> lim){ S.car.u= lim; S.car.vu*=-0.3; }
  S.car.bank=lerp(S.car.bank, clamp(S.car.vu/CARMAX,-1,1), Math.min(1,dt*9));

  /* throttle: UP accelerates, DOWN brakes; eases back to cruise on release */
  const thr = keys.up?THROTTLE[1] : keys.down?THROTTLE[0] : 1;
  S.car.spd = lerp(S.car.spd, thr, Math.min(1, dt*(keys.down?6:3.2)));
  S.car.pitch = lerp(S.car.pitch, (keys.up?1:0)-(keys.down?1:0), Math.min(1,dt*6));

  /* the tide — recording never stops. In ML-safe mode the same footage
     still enters the pipeline, just at half the volume. */
  const passive = val(PASSIVE)*(S.mlsafe?0.5:1);
  S.load=clamp(S.load+passive*dt, floorLoad(), 100);
  S.maxLoad=Math.max(S.maxLoad,S.load);

  /* three escalating, cinematic alerts */
  if(S.st==='play') for(const a of LOAD_ALERTS){
    if(S.load>=a.at && S.alertsFired.indexOf(a.at)<0){
      S.alertsFired.push(a.at); bigEvent(a.s,'',a.c,1.9); sfx.alert();
    }
  }

  /* spawning */
  S.spawnT-=dt; S.neckT-=dt;
  if(S.spawnT<=0){
    S.spawnT=val(SPAWN)*rnd(0.78,1.28);
    const r=Math.random();
    if(S.neckT<=0&&r<0.13&&!S.mlsafe){ spawnConstraint(); S.neckT=4.4-1.6*p; }
    else if(r<0.60) spawnData();
    else spawnPressure();
  }

  /* objects */
  for(let i=S.obj.length-1;i>=0;i--){
    const o=S.obj[i];
    o.z-=sp*dt;
    o.spin=(o.spin||0)+dt*2.2;

    /* ML-safe: encode the incoming surge before it reaches the pipeline.
       The workload still exists — its representation is just smaller. */
    if(S.mlsafe&&o.t==='pressure'&&o.z<0.6&&!o.reduced){
      o.reduced=true;
      popTxt(o.u,o.z,'ENCODED',C.grn);
      ring(o.u,o.z,C.grn); sparks(o.u,o.z,C.grn,10);
    }
    if(o.z<-0.12){ S.obj.splice(i,1); continue; }

    if(!o.done && o.z<=CAR_Z){
      o.done=true;
      const du=Math.abs(o.u-S.car.u), reach=S.car.uw+o.uw;
      if(o.t==='constraint'){
        const insideGap = (S.car.u-S.car.uw > o.g+0.012) && (S.car.u+S.car.uw < o.g+o.gw-0.012);
        if(!insideGap) bump(HIT_WALL,o.label+' CLIPPED',C.red,o.u,o.z,'wall');
        else nearMiss('CLEARED :: '+o.label);
      } else if(du<reach){
        if(o.t==='data') collect(o);
        else pressureHit(o);
      } else if(o.t!=='data' && du-reach<NEAR){
        nearMiss('NEAR MISS');
      }
    }
  }

  /* roadside props recycle */
  S.props.forEach(pr=>{
    pr.z-=sp*dt;
    if(pr.z<-0.06){ pr.z+=2.42; pr.k=(Math.random()*100)|0; pr.u=1.28+rnd(0,0.5); }
  });

  /* particles */
  for(let i=S.parts.length-1;i>=0;i--){
    const q=S.parts[i];
    q.life-=dt; q.x+=q.vx*dt; q.y+=q.vy*dt; q.vy+=560*dt; q.vx*=0.98;
    if(q.life<=0) S.parts.splice(i,1);
  }
  for(let i=S.pops.length-1;i>=0;i--){ const q=S.pops[i]; q.life-=dt; q.y-=52*dt; if(q.life<=0) S.pops.splice(i,1); }
  for(let i=S.rings.length-1;i>=0;i--){ const q=S.rings[i]; q.life-=dt; if(q.life<=0) S.rings.splice(i,1); }

  /* the data bar eases toward its true value so surges visibly fill it */
  S.loadShown += (S.load-S.loadShown)*Math.min(1,dt*7);
  if(S.loadPulse>0) S.loadPulse=Math.max(0,S.loadPulse-dt*2.2);

  if(S.noteT>0) S.noteT-=dt;
  if(S.bigT>0) S.bigT-=dt;
  if(S.shake>0) S.shake=Math.max(0,S.shake-dt*34);
  if(S.flash>0) S.flash=Math.max(0,S.flash-dt*2.4);
  if(S.comboPulse>0) S.comboPulse=Math.max(0,S.comboPulse-dt*3);

  /* red alert: colour + sound, never camera shake */
  if(S.st==='play'&&S.load>=78){
    S.alertT-=dt;
    if(S.alertT<=0){ S.alertT=0.5; sfx.alert(); }
  } else S.alertT=0;

  /* crisis: the pipeline can no longer move what the fleet records */
  if(S.st==='play'&&S.load>=100){
    S.st='choice'; S.choice=0; S.shake=16; S.flash=0.9; S.flashC='#ff6070';
    AUDIO.setMode('crisis'); sfx.dead();
  }
}

/* ---------- events ---------- */
function collect(o){
  S.grabbed++; S.combo++;
  S.bestCombo=Math.max(S.bestCombo,S.combo);
  const m=clamp(1+Math.floor(S.combo/5),1,5);
  if(m!==S.mult){ S.mult=m; S.comboPulse=1; sfx.combo(m); } else sfx.grab();
  S.mb+=o.mb*S.mult;
  S.load=Math.max(floorLoad(),S.load-RELIEF);
  S.loadPulse=Math.max(S.loadPulse,0.5); S.loadPulseC=C.grn;
  popTxt(o.u,o.z, m>1?('+VIDEO ×'+m):'+VIDEO', C.grn);
  ring(o.u,o.z,C.grn); sparks(o.u,o.z,C.grn,7);
}
function pressureHit(o){
  const eff=o.load*(S.mlsafe?(1-MLSAFE_REDUCTION):1);
  S.load=clamp(S.load+eff,floorLoad(),100);
  S.maxLoad=Math.max(S.maxLoad,S.load);
  S.hits++; S.pressureHits++; S.pressureGB+=o.gb; S.combo=0; S.mult=1;
  S.loadPulse=1; S.loadPulseC=S.mlsafe?'#5ce08a':'#ff5647';
  S.shake=Math.max(S.shake,10); S.flash=0.55; S.flashC=S.mlsafe?'#8fe0b0':'#ff7ab0';
  const c=S.mlsafe?C.grn:C.mag;
  note((S.mlsafe?'ENCODED :: ':'DATA SURGE :: ')+o.tag, c, 1.8);
  popTxt(o.u,o.z,'+'+Math.round(eff)+' LOAD',c);
  sparks(o.u,o.z,c,22); ring(o.u,o.z,c);
  sfx.big();
}
function nearMiss(label){
  S.nears++;
  S.load=Math.max(floorLoad(),S.load-1.1);
  popTxt(S.car.u,CAR_Z+0.06,label,C.violet);
  sfx.near();
}
function bump(amount,msg,col,u,z,kind){
  S.load=clamp(S.load+amount,floorLoad(),100);
  S.maxLoad=Math.max(S.maxLoad,S.load);
  S.hits++; S.combo=0; S.mult=1;
  S.loadPulse=1; S.loadPulseC=kind==='wall'?'#ff6070':'#ff5647';
  S.shake=Math.max(S.shake,kind==='wall'?15:11);
  S.flash=0.6; S.flashC=kind==='wall'?'#ff6070':'#ff7ab0';
  note(msg,col,1.8); popTxt(u,z,'+'+amount+'%',col);
  sparks(u,z,col,26); ring(u,z,col);
  kind==='wall'?sfx.wall():sfx.big();
}
function popTxt(u,z,s,c){ S.pops.push({x:xOf(u,z),y:yOf(z),s,c,life:1.0}); }
function ring(u,z,c){ S.rings.push({x:xOf(u,z),y:yOf(z),c,life:0.45}); }
function sparks(u,z,c,n){
  const x=xOf(u,z), y=yOf(z);
  for(let i=0;i<n;i++) S.parts.push({x,y,vx:rnd(-220,220),vy:rnd(-320,60),life:rnd(0.3,0.8),c});
}

/* ---------- spawners ---------- */
const freeU=(w)=>rnd(-1+w+0.03, 1-w-0.03);
function spawnData(){
  const uw=0.05;
  const mb=Math.round(rnd(30,70))*1024;   // ~30-70 GB of video; totals read in TB
  S.obj.push({t:'data',u:freeU(uw),uw,z:ZSPAWN,mb,spin:0});
}
function spawnPressure(){
  const e=PRESSURE[(Math.random()*PRESSURE.length)|0];
  const uw=e.tag.length>9?0.15:0.12;
  const gb=Math.round(e.load*rnd(2.4,3.6));   // illustrative +XX GB payload
  if(!S.mlsafe) tutOnce('press','MORE CAMERAS = MORE DATA',C.warn,2.2);
  S.obj.push({t:'pressure',u:freeU(uw),uw,z:ZSPAWN,tag:e.tag,load:e.load,gb,icon:e.icon,spin:0});
}
function spawnConstraint(){
  const gw=S.car.uw*2+lerp(0.30,0.14,prog());
  const label=CONSTRAINTS[(Math.random()*CONSTRAINTS.length)|0];
  S.obj.push({t:'constraint',u:0,uw:1,z:ZSPAWN,g:rnd(-1+0.04,1-gw-0.04),gw,label,spin:0});
}

/* =====================================================================
   RENDER — world
   ===================================================================== */
let SKY=null, SKYH=0;
function puff(x,y,r){
  ctx.beginPath();
  ctx.arc(x-r,y,r*0.7,0,7); ctx.arc(x-r*0.2,y-r*0.55,r,0,7);
  ctx.arc(x+r,y-r*0.15,r*0.82,0,7); ctx.arc(x+r*0.3,y+r*0.05,r*0.72,0,7);
  ctx.ellipse(x,y+r*0.32,r*1.8,r*0.6,0,0,7); ctx.fill();
}
function cloudLayer(off,sc,y,xs){
  xs.forEach(k=>{
    let cx=((k*280 - off)%(W+260)); if(cx<-130) cx+=W+260;
    const cy=y+(k%3)*16, r=24*sc;
    ctx.fillStyle='rgba(255,255,255,.94)'; puff(cx,cy,r);
    ctx.fillStyle='rgba(255,232,200,.6)'; ctx.beginPath();
    ctx.ellipse(cx,cy+r*0.5,r*1.5,r*0.34,0,0,7); ctx.fill();
  });
}
function hillLayer(off,base,r,cDark,cLight){
  const step=r*1.5;
  for(let x=-(off%step)-step; x<W+step; x+=step){
    ctx.fillStyle=cDark;
    ctx.beginPath(); ctx.ellipse(x,base,r,r*0.72,0,Math.PI,2*Math.PI); ctx.fill();
    ctx.fillStyle=cLight;
    ctx.beginPath(); ctx.ellipse(x-r*0.28,base,r*0.66,r*0.48,0,Math.PI,2*Math.PI); ctx.fill();
  }
}
function sky(t){
  if(!SKY||SKYH!==HZ){
    SKY=grad(0,HUD_H,0,HZ+40,[[0,'#070a13'],[0.5,'#0c1522'],[0.8,'#10202f'],[1,'#153046']]);
    SKYH=HZ;
  }
  ctx.fillStyle=SKY; ctx.fillRect(0,HUD_H,W,HZ+40-HUD_H);

  /* faint stars */
  for(let i=0;i<48;i++){
    const x=(i*151.3)%W, y=HUD_H+((i*61.7)%(HZ-HUD_H-24));
    const a=0.18+0.5*Math.abs(Math.sin(t*0.6+i));
    ctx.fillStyle='rgba(200,215,240,'+(a*(1-(y-HUD_H)/(HZ-HUD_H))).toFixed(3)+')';
    ctx.fillRect(x,y,i%6?1:2,i%6?1:2);
  }
  /* low Beamr-green horizon glow — the one light source */
  const sx=CX-S.curve*40;
  let g=ctx.createRadialGradient(sx,HZ,8,sx,HZ,240);
  g.addColorStop(0,'rgba(87,224,138,.34)'); g.addColorStop(0.5,'rgba(50,150,110,.12)'); g.addColorStop(1,'rgba(87,224,138,0)');
  ctx.fillStyle=g; ctx.fillRect(0,HZ-160,W,180);

  /* dark rolling hills silhouette */
  hillLayer((S.dist*9)%1000,  HZ+2, 60, '#0c2018','#0f2a1e');
  hillLayer((S.dist*17)%1000, HZ+3, 40, '#102a1e','#163a28');
}

function road(t){
  const hw0=roadW(), scroll=S.dist*7;
  for(let y=HZ; y<RBOT; y+=2){
    const s=(y-HZ)/(RBOT-HZ);
    if(s<0.004) continue;
    const z=(1/s-1)/DEPTH;
    const hw=hw0*s, cx=CX+cOf(z);
    const band=Math.floor(z*3.2-scroll)&1;

    /* dark green verge */
    ctx.fillStyle=band?'#0f2417':'#0c1e13';
    ctx.fillRect(0,y,W,2);
    const rb=Math.max(2,hw*0.09);
    /* subtle grey shoulder */
    ctx.fillStyle=band?'#3a4152':'#2c3242';
    ctx.fillRect(cx-hw-rb,y,rb,2); ctx.fillRect(cx+hw,y,rb,2);
    /* clean dark asphalt */
    ctx.fillStyle=band?'#232733':'#1c202a';
    ctx.fillRect(cx-hw,y,hw*2,2);
    /* Beamr-green centre dashes + dim white edges */
    if(band){
      ctx.fillStyle='rgba(87,224,138,.85)';
      ctx.fillRect(cx-Math.max(1,hw*0.02),y,Math.max(1,hw*0.04),2);
    }
    ctx.fillStyle='rgba(220,230,245,.35)';
    ctx.fillRect(cx-hw+rb*0.2,y,Math.max(1,hw*0.014),2);
    ctx.fillRect(cx+hw-rb*0.2-Math.max(1,hw*0.014),y,Math.max(1,hw*0.014),2);
  }
  /* cool haze at the vanishing point */
  const g=grad(0,HZ,0,HZ+140,[[0,'rgba(40,90,80,.45)'],[0.5,'rgba(20,50,55,.18)'],[1,'rgba(20,50,55,0)']]);
  ctx.fillStyle=g; ctx.fillRect(0,HZ,W,140);
}

/* --- roadside props --- */
function propTree(x,ybase,s,k){
  const hgt=100*s, wid=54*s;
  if(hgt<3) return;
  const v=k%3;
  ctx.fillStyle='rgba(4,8,6,.45)';
  ctx.beginPath(); ctx.ellipse(x,ybase,wid*0.42,Math.max(1,hgt*0.05),0,0,7); ctx.fill();
  ctx.fillStyle='#7a4a24';
  const trunkW=Math.max(1,wid*0.13);
  ctx.fillRect(x-trunkW/2,ybase-hgt*0.42,trunkW,hgt*0.42);
  ctx.strokeStyle='#24331c'; ctx.lineWidth=Math.max(1,wid*0.05); ctx.lineJoin='round';
  const canopy=(cLight,cDark)=>{
    if(v===1){                                /* conifer */
      for(let i=0;i<4;i++){
        const yy=ybase-hgt*0.38-i*hgt*0.16, ww=wid*(0.54-i*0.11);
        ctx.beginPath(); ctx.moveTo(x,yy-hgt*0.24); ctx.lineTo(x-ww,yy); ctx.lineTo(x+ww,yy); ctx.closePath();
        ctx.fillStyle=i%2?cDark:cLight; ctx.fill(); if(hgt>20)ctx.stroke();
      }
    } else if(v===0){                         /* broadleaf */
      ctx.fillStyle=cDark;
      ctx.beginPath(); ctx.ellipse(x,ybase-hgt*0.64,wid*0.5,hgt*0.34,0,0,7); ctx.fill(); if(hgt>20)ctx.stroke();
      ctx.fillStyle=cLight;
      ctx.beginPath(); ctx.ellipse(x-wid*0.14,ybase-hgt*0.72,wid*0.3,hgt*0.2,0,0,7); ctx.fill();
    } else {                                  /* twin bush */
      ctx.fillStyle=cDark;
      ctx.beginPath(); ctx.ellipse(x-wid*0.2,ybase-hgt*0.34,wid*0.34,hgt*0.24,0,0,7); ctx.fill();
      ctx.beginPath(); ctx.ellipse(x+wid*0.18,ybase-hgt*0.48,wid*0.38,hgt*0.28,0,0,7); ctx.fill(); if(hgt>20)ctx.stroke();
      ctx.fillStyle=cLight;
      ctx.beginPath(); ctx.ellipse(x+wid*0.1,ybase-hgt*0.56,wid*0.22,hgt*0.16,0,0,7); ctx.fill();
    }
  };
  canopy(v===1?'#2f6b42':'#357a4a', v===1?'#1a4229':'#204d30');
}
function propLamp(x,ybase,s,side){
  const hgt=150*s; if(hgt<6) return;
  const armW=34*s*(side<0?1:-1);
  ctx.fillStyle='#8b929c';
  ctx.fillRect(x-Math.max(1,2*s),ybase-hgt,Math.max(1,4*s),hgt);
  ctx.fillStyle='#5c636d'; ctx.fillRect(x-Math.max(1,2*s),ybase-hgt,Math.max(1,1.6*s),hgt);
  ctx.fillStyle='#8b929c'; ctx.fillRect(Math.min(x,x+armW),ybase-hgt,Math.abs(armW),Math.max(1,3*s));
  const lx=x+armW;
  ctx.fillStyle='#2c313b'; ctx.fillRect(lx-5*s,ybase-hgt,10*s,Math.max(1,4*s));
}
/* Beamr AV roadside signs — sparse, single-word, read at a glance */
function propSign(x,ybase,s,k,side){
  const postH=Math.max(6,60*s), pw=Math.max(2,5*s);
  const place=(w,h,draw)=>{ const cy=ybase-postH-h/2; signPost(x,cy+h/2,ybase,pw); draw(x,cy,w); };
  switch(k%4){
    case 0: { const w=Math.max(14,52*s); place(w,w*1.02,(X,Y,W)=>signShield(X,Y,W,'UP TO','50')); break; }
    case 1: { const w=Math.max(16,70*s); place(w,w*0.5, (X,Y,W)=>signGuide(X,Y,W,['BEAMR'])); break; }
    case 2: { const w=Math.max(16,64*s); place(w,w*1.02,(X,Y,W)=>signDiamond(X,Y,W,['DATA'])); break; }
    default:{ const w=Math.max(16,68*s); place(w,w*0.46,(X,Y,W)=>signInfo(X,Y,W,['KEEP'])); }
  }
}
function props(){
  const list=S.props.slice().sort((a,b)=>b.z-a.z);
  list.forEach(pr=>{
    const s=sOf(pr.z); if(s<0.05) return;
    const y=yOf(pr.z);
    const u=pr.side<0?-pr.u:pr.u;
    const x=xOf(u,pr.z,s);
    if(x<-200||x>W+200) return;
    if(pr.k%14===0) propLamp(x,y,s,pr.side);
    else propTree(x,y,s,pr.k);
  });
}

/* =====================================================================
   BEAMR ROAD-SIGN SYSTEM — reusable cartoon sign drawers (bold outline)
   Every collectible, obstacle and roadside prop is one of these signs.
   ===================================================================== */
const SIGN_INK='#1c2029';
function panel(x,y,w,h,r,fill,key){
  const o=Math.max(2,w*0.05), f=Math.max(2,w*0.06);
  ctx.lineJoin='round';
  ctx.fillStyle=SIGN_INK; rr(x-w/2-o,y-h/2-o,w+2*o,h+2*o,r+o*0.7); ctx.fill();     // chunky border
  ctx.fillStyle=fill;     rr(x-w/2,y-h/2,w,h,r); ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.16)'; rr(x-w/2+f,y-h/2+f*0.8,w-2*f,h*0.24,r*0.5); ctx.fill();  // top gloss
  if(key){ ctx.strokeStyle=key; ctx.lineWidth=Math.max(1,w*0.03); rr(x-w/2+f,y-h/2+f,w-2*f,h-2*f,Math.max(1,r-o)); ctx.stroke(); }
}
function signText(x,y,w,h,lines,col){
  const n=lines.length, longest=Math.max(1,...lines.map(l=>l.length));
  const fs=Math.max(5, Math.min(w*0.84/(longest*1.02), h*0.74/(n*1.18)));
  const lh=fs*1.18, y0=y-(n-1)*lh/2+fs*0.34;
  for(let i=0;i<n;i++) txt(lines[i],x,y0+i*lh,col,fs,'center');
}
function arrowGlyph(x,y,w,col){                        // down chevron for gantries
  ctx.fillStyle=col; ctx.strokeStyle=SIGN_INK; ctx.lineWidth=Math.max(1,w*0.09); ctx.lineJoin='round';
  ctx.beginPath(); ctx.moveTo(x-w/2,y-w*0.28); ctx.lineTo(x+w/2,y-w*0.28); ctx.lineTo(x,y+w*0.42); ctx.closePath();
  ctx.fill(); ctx.stroke();
}
/* green highway guide sign — the workhorse (DATA + gantries) */
function signGuide(x,y,w,lines,opt){ opt=opt||{};
  const h=opt.h||w*(lines.length>1?0.66:0.5);
  panel(x,y,w,h,Math.max(3,w*0.07),opt.fill||'#1f9d4e','#f4f8ff');
  signText(x,y,w,h,lines,'#ffffff');
}
/* orange diamond warning — the load pressure (green when ML-encoded) */
function signDiamond(x,y,w,lines,opt){ opt=opt||{};
  const col=opt.enc?'#54c47f':'#ff9f2e', sz=w*0.72, o=Math.max(2,w*0.05);
  ctx.save(); ctx.translate(x,y); ctx.rotate(Math.PI/4); ctx.lineJoin='round';
  ctx.fillStyle=SIGN_INK; rr(-sz/2-o,-sz/2-o,sz+2*o,sz+2*o,w*0.06); ctx.fill();
  ctx.fillStyle=col;      rr(-sz/2,-sz/2,sz,sz,w*0.05); ctx.fill();
  ctx.strokeStyle=SIGN_INK; ctx.lineWidth=Math.max(1,w*0.035); rr(-sz/2+w*0.05,-sz/2+w*0.05,sz-w*0.1,sz-w*0.1,w*0.03); ctx.stroke();
  ctx.restore();
  signText(x,y,sz*0.98,sz*0.92,lines,'#1c2029');
}
/* US route shield — roadside brand + tier badge */
function signShield(x,y,w,top,num){
  const h=w*1.02, o=Math.max(2,w*0.05);
  const path=(pad)=>{ const ww=w/2+pad, hh=h/2+pad; ctx.beginPath();
    ctx.moveTo(x-ww*0.92,y-hh); ctx.lineTo(x+ww*0.92,y-hh);
    ctx.quadraticCurveTo(x+ww,y-hh,x+ww,y-hh+ww*0.55);
    ctx.lineTo(x+ww*0.66,y+hh*0.18);
    ctx.quadraticCurveTo(x+ww*0.5,y+hh*0.7,x,y+hh);
    ctx.quadraticCurveTo(x-ww*0.5,y+hh*0.7,x-ww*0.66,y+hh*0.18);
    ctx.lineTo(x-ww,y-hh+ww*0.55);
    ctx.quadraticCurveTo(x-ww,y-hh,x-ww*0.92,y-hh); ctx.closePath(); };
  ctx.lineJoin='round'; ctx.fillStyle=SIGN_INK; path(o); ctx.fill();
  ctx.fillStyle='#f4f7ff'; path(0); ctx.fill();
  txt(top||'BEAMR',x,y-h*0.2,'#1c2029',Math.max(5,w*0.15),'center');
  txt(num||'50', x,y+h*0.28,'#1c2029',Math.max(8,w*0.46),'center');
}
/* white directional arrow sign — dir:1 right, -1 left */
function signArrow(x,y,w,text,dir){
  const h=w*0.42, o=Math.max(2,w*0.05);
  const path=(pad)=>{ const ww=w/2+pad, hh=h/2+pad; ctx.beginPath();
    if(dir>0){ ctx.moveTo(x-ww,y-hh); ctx.lineTo(x+ww-hh,y-hh); ctx.lineTo(x+ww,y); ctx.lineTo(x+ww-hh,y+hh); ctx.lineTo(x-ww,y+hh); }
    else{ ctx.moveTo(x+ww,y-hh); ctx.lineTo(x-ww+hh,y-hh); ctx.lineTo(x-ww,y); ctx.lineTo(x-ww+hh,y+hh); ctx.lineTo(x+ww,y+hh); }
    ctx.closePath(); };
  ctx.lineJoin='round'; ctx.fillStyle=SIGN_INK; path(o); ctx.fill();
  ctx.fillStyle='#f4f7ff'; path(0); ctx.fill();
  signText(x-dir*h*0.16,y,w*1.05,h,[text],'#1c2029');
}
/* blue info sign */
function signInfo(x,y,w,lines){
  const h=w*(lines.length>1?0.62:0.46);
  panel(x,y,w,h,Math.max(3,w*0.06),'#2b6fd6','#f4f8ff'); signText(x,y,w,h,lines,'#ffffff');
}
/* grey post from a sign's bottom edge down to the ground */
function signPost(x,yTop,yBase,wpx){
  const pw=Math.max(1,wpx);
  ctx.fillStyle='#8b929c'; ctx.fillRect(x-pw/2,yTop,pw,yBase-yTop);
  ctx.fillStyle='#5c636d'; ctx.fillRect(x-pw/2,yTop,Math.max(1,pw*0.4),yBase-yTop);
  ctx.fillStyle='#3f4650'; ctx.fillRect(x-pw*0.9,yBase-Math.max(1,pw*0.5),pw*1.8,Math.max(1,pw*0.5));
}

/* --- obstacles --- */
function drawObjects(t){
  const list=S.obj.slice().sort((a,b)=>b.z-a.z);
  list.forEach(o=>{
    const s=sOf(o.z); if(s<0.045) return;
    const y=yOf(o.z), x=xOf(o.u,o.z,s), hw=roadW()*s;
    const fade=clamp((ZSPAWN-o.z)*1.6+0.15,0,1);
    ctx.globalAlpha=fade;
    if(o.t==='data')          drawData(x,y,s,o,t);
    else if(o.t==='pressure') drawPressure(x,y,s,o);
    else                      drawConstraint(o,s,y,hw,t);
    ctx.globalAlpha=1;
  });
}
function shadowOval(x,y,w,h){
  ctx.fillStyle='rgba(3,4,10,.5)';
  ctx.beginPath(); ctx.ellipse(x,y,w,h,0,0,7); ctx.fill();
}
/* VIDEO DATA — one consistent glowing green tile the player collects */
function drawData(x,y,s,o,t){
  const w=Math.max(12,pxw(o.uw,s)*1.7), r=w*0.5;
  const bob=Math.sin(t*3+o.u*9)*w*0.09, cy=y-w*0.72+bob;
  shadowOval(x,y,w*0.38,w*0.12);
  const g=ctx.createRadialGradient(x,cy,2,x,cy,w*1.3);
  g.addColorStop(0,'rgba(87,224,138,.5)'); g.addColorStop(1,'rgba(87,224,138,0)');
  ctx.fillStyle=g; ctx.beginPath(); ctx.arc(x,cy,w*1.3,0,7); ctx.fill();
  ctx.save(); ctx.translate(x,cy);
  ctx.fillStyle='#0c241a'; rr(-r,-r,w,w,w*0.24); ctx.fill();
  ctx.strokeStyle=C.grn; ctx.lineWidth=Math.max(1.5,w*0.1); rr(-r,-r,w,w,w*0.24); ctx.stroke();
  ctx.fillStyle=C.grn; ctx.beginPath();          // play glyph = video
  ctx.moveTo(-r*0.28,-r*0.42); ctx.lineTo(r*0.52,0); ctx.lineTo(-r*0.28,r*0.42); ctx.closePath(); ctx.fill();
  ctx.restore();
}
/* pictograms for the real pipeline stressors, drawn dark inside the diamond */
function hazardIcon(type,x,y,r,col,bg){
  ctx.save(); ctx.fillStyle=col; ctx.strokeStyle=col;
  ctx.lineWidth=Math.max(1,r*0.2); ctx.lineJoin='round'; ctx.lineCap='round';
  if(type==='cam'){
    rr(x-r,y-r*0.5,r*2,r*1.1,r*0.24); ctx.fill();
    ctx.fillStyle=bg; ctx.beginPath(); ctx.arc(x,y+r*0.05,r*0.42,0,7); ctx.fill();
    ctx.fillStyle=col; ctx.beginPath(); ctx.arc(x,y+r*0.05,r*0.2,0,7); ctx.fill();
    ctx.fillRect(x+r*0.35,y-r*0.8,r*0.5,r*0.32);
  } else if(type==='film'){
    rr(x-r,y-r*0.75,r*2,r*1.5,r*0.18); ctx.fill();
    ctx.fillStyle=bg;
    for(let i=-1;i<=1;i++){ const yy=y+i*r*0.56;
      ctx.fillRect(x-r*0.92,yy-r*0.12,r*0.26,r*0.24); ctx.fillRect(x+r*0.66,yy-r*0.12,r*0.26,r*0.24); }
    ctx.fillRect(x-r*0.42,y-r*0.5,r*0.84,r);
  } else if(type==='clock'){
    ctx.beginPath(); ctx.arc(x,y,r*0.9,0,7); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x,y-r*0.55); ctx.moveTo(x,y); ctx.lineTo(x+r*0.42,y+r*0.18); ctx.stroke();
  } else if(type==='fleet'){
    rr(x-r*0.95,y-r*0.15,r*1.9,r*0.7,r*0.22); ctx.fill();          // car body
    rr(x-r*0.5,y-r*0.62,r*1.0,r*0.5,r*0.18); ctx.fill();           // cabin
    ctx.fillStyle=bg; ctx.beginPath(); ctx.arc(x-r*0.5,y+r*0.62,r*0.3,0,7); ctx.arc(x+r*0.5,y+r*0.62,r*0.3,0,7); ctx.fill();
    ctx.fillStyle=col; ctx.beginPath(); ctx.arc(x-r*0.5,y+r*0.55,r*0.26,0,7); ctx.arc(x+r*0.5,y+r*0.55,r*0.26,0,7); ctx.fill();
  } else if(type==='fps'){
    ctx.beginPath(); ctx.arc(x,y+r*0.25,r*0.85,Math.PI,0); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x,y+r*0.25); ctx.lineTo(x+r*0.5,y-r*0.35); ctx.stroke();
    ctx.beginPath(); ctx.arc(x,y+r*0.25,r*0.14,0,7); ctx.fill();
  } else if(type==='sensor'){
    rr(x-r*0.28,y-r*0.15,r*0.56,r*0.95,r*0.1); ctx.fill();
    ctx.beginPath(); ctx.arc(x,y-r*0.25,r*0.5,Math.PI*1.18,Math.PI*1.82); ctx.stroke();
    ctx.beginPath(); ctx.arc(x,y-r*0.25,r*0.85,Math.PI*1.18,Math.PI*1.82); ctx.stroke();
  } else {
    ctx.fillRect(x-r*0.13,y-r*0.7,r*0.26,r*0.9); ctx.beginPath(); ctx.arc(x,y+r*0.62,r*0.16,0,7); ctx.fill();
  }
  ctx.restore();
}
/* PRESSURE — a clean arcade hazard chip: pictogram of the stressor + its short
   scaling label. Read in a fraction of a second. Green when ML-encoded. */
function drawPressure(x,y,s,o){
  const enc=o.reduced;
  const w=Math.max(14,pxw(o.uw,s)*1.9)*(enc?0.66:1);   // ML-safe: emerges smaller
  const col=enc?C.grn:C.warn, bg=enc?'#0c241a':'#1c1206', hw=w*0.62, cy=y-w*0.66;
  shadowOval(x,y,w*0.44,w*0.13);
  const g=ctx.createRadialGradient(x,cy,2,x,cy,w*1.3);
  g.addColorStop(0, enc?'rgba(87,224,138,.4)':'rgba(255,122,69,.42)'); g.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=g; ctx.beginPath(); ctx.arc(x,cy,w*1.3,0,7); ctx.fill();
  ctx.fillStyle=bg; rr(x-hw,cy-hw,hw*2,hw*2,w*0.22); ctx.fill();
  ctx.strokeStyle=col; ctx.lineWidth=Math.max(1.5,w*0.1); rr(x-hw,cy-hw,hw*2,hw*2,w*0.22); ctx.stroke();
  if(w>26) hazardIcon(o.icon,x,cy-hw*0.32,w*0.24,col,bg);
  if(w>26) txt(o.tag,x,cy+hw*0.62,col,Math.max(8,w*0.2),'center');
}
/* CONSTRAINT — guardrail barriers with a drivable gap, under an overhead
   green gantry guide sign naming the pipeline stage + a white gap arrow */
function drawConstraint(o,s,y,hw,t){
  const cx=CX+cOf(o.z), h=104*s;
  /* solid warm barriers close in from both sides — the pipeline tightening */
  const barrier=(u0,u1)=>{
    const a=cx+u0*hw, b=cx+u1*hw; if(b-a<2) return;
    ctx.fillStyle=grad(a,y-h,a,y,[[0,'#3a2016'],[1,'#241009']]); ctx.fillRect(a,y-h,b-a,h);
    ctx.fillStyle=C.warn; ctx.fillRect(a,y-h,b-a,Math.max(2,h*0.06));           // warm cap
    const step=Math.max(6,24*s);                                                // hazard chevrons
    for(let xx=a;xx<b;xx+=step*2){
      ctx.fillStyle='rgba(255,122,69,.9)'; ctx.fillRect(xx,y-h*0.66,Math.min(step,b-xx),h*0.5);
    }
    ctx.strokeStyle='rgba(0,0,0,.5)'; ctx.lineWidth=Math.max(1,2*s); ctx.strokeRect(a,y-h,b-a,h);
  };
  barrier(-1,o.g); barrier(o.g+o.gw,1);
  const ga=cx+o.g*hw, gb=cx+(o.g+o.gw)*hw, gc=(ga+gb)/2;
  /* the safe gap glows Beamr green */
  const gg=grad(gc,y-h*1.2,gc,y,[[0,'rgba(87,224,138,0)'],[1,'rgba(87,224,138,.28)']]);
  ctx.fillStyle=gg; ctx.fillRect(ga,y-h*1.2,gb-ga,h*1.2);
  ctx.fillStyle=C.grn;
  ctx.fillRect(ga-Math.max(1,2*s),y-h*1.05,Math.max(1,3*s),h*1.05);
  ctx.fillRect(gb-Math.max(1,1*s),y-h*1.05,Math.max(1,3*s),h*1.05);
  /* overhead label banner */
  if(h>34){
    const gy=y-h*1.5, bw=hw*1.9, bh=Math.max(11,30*s);
    ctx.fillStyle='rgba(10,12,16,.92)'; rr(cx-bw/2,gy-bh/2,bw,bh,bh*0.28); ctx.fill();
    ctx.strokeStyle=C.warn; ctx.lineWidth=Math.max(1,2*s); rr(cx-bw/2,gy-bh/2,bw,bh,bh*0.28); ctx.stroke();
    txt(o.label,cx,gy+bh*0.18,C.wht,Math.max(8,Math.min(bh*0.5,bw/Math.max(o.label.length,1)*1.5)),'center');
    arrowGlyph(gc,gy+bh*0.5+10*s,Math.max(8,18*s),blink(220)?C.grn:'rgba(87,224,138,.5)');
  }
}

/* convex hull (monotone chain) — used for a single clean car silhouette */
function convexHull(pts){
  const p=pts.slice().sort((a,b)=>a[0]-b[0]||a[1]-b[1]);
  if(p.length<3) return p;
  const cr=(o,a,b)=>(a[0]-o[0])*(b[1]-o[1])-(a[1]-o[1])*(b[0]-o[0]);
  const lo=[],up=[];
  for(const q of p){ while(lo.length>=2&&cr(lo[lo.length-2],lo[lo.length-1],q)<=0)lo.pop(); lo.push(q); }
  for(let i=p.length-1;i>=0;i--){ const q=p[i]; while(up.length>=2&&cr(up[up.length-2],up[up.length-1],q)<=0)up.pop(); up.push(q); }
  lo.pop(); up.pop(); return lo.concat(up);
}
/* a rounded-rectangle ring of points in car space (for lofting a smooth body) */
function roundRectRing(x0,x1,y0,y1,r,n){
  n=n||5; r=Math.min(r,(x1-x0)/2,(y1-y0)/2);
  const pts=[], cxr=x1-r, cxl=x0+r, cyt=y1-r, cyb=y0+r;
  const arc=(cx,cy,a0,a1)=>{ for(let i=0;i<=n;i++){ const a=a0+(a1-a0)*i/n; pts.push([cx+Math.cos(a)*r, cy+Math.sin(a)*r]); } };
  arc(cxr,cyb,-Math.PI/2,0); arc(cxr,cyt,0,Math.PI/2);
  arc(cxl,cyt,Math.PI/2,Math.PI); arc(cxl,cyb,Math.PI,1.5*Math.PI);
  return pts;
}
/* --- the car: a clean flat-vector rear view of the AV test vehicle ------
   Two boxes (body + cabin) projected with a vertical-axis yaw so a turn
   reveals the SIDE, but rendered flat & minimal like the reference art:
   one silhouette outline (convex hull, no interior panel lines), off-white
   body, dark tinted glass inset, a full-width tail-light bar with a black
   centre panel, plate and exhaust. A small clean roof pod shows the stack. */
const CAR_OUTLINE='#2f2e2b', CAR_BODY='#f3f2ee', CAR_SIDE='#dcdbd4', CAR_GREY='#8c9096', CAR_GLASS='#181a20';
function drawCar(t){
  const s=sOf(CAR_Z), y=yOf(CAR_Z), x=xOf(S.car.u,CAR_Z,s);
  const w=Math.max(22,pxw(S.car.uw,s));
  const braking=!!keys.down, tier=S.tier;

  const zc0=CAR_Z, zf0=CAR_Z+0.28;
  const roadA=Math.atan2((cOf(zf0)-cOf(zc0))+S.car.u*roadW()*(sOf(zf0)-sOf(zc0))*0.5, -(yOf(zf0)-yOf(zc0)));
  const phi=clamp(S.car.bank*0.6 + roadA*0.42, -0.7, 0.7);
  const cosf=Math.cos(phi), sinf=Math.sin(phi);
  const SX=w*0.5, SY=w*0.5, SZ=w*0.32;                  // compact, more head-on
  const ow=Math.max(1.4,w*0.035);                       // outline weight

  const proj=(X,Y,Z)=>{ const Zc=Z-0.5, Xr=X*cosf+Zc*sinf, Zr=-X*sinf+Zc*cosf;
    return [Xr*SX, -Y*SY-(Zr+0.5)*SZ]; };
  const path=(p)=>{ ctx.beginPath();
    for(let i=0;i<p.length;i++){ const P=proj(p[i][0],p[i][1],p[i][2]); i?ctx.lineTo(P[0],P[1]):ctx.moveTo(P[0],P[1]); }
    ctx.closePath(); };
  const poly=(p,fill,stroke,lw)=>{ path(p); if(fill){ctx.fillStyle=fill;ctx.fill();}
    if(stroke){ctx.lineJoin='round';ctx.strokeStyle=stroke;ctx.lineWidth=lw||ow;ctx.stroke();} };
  const projRing=(ring,z)=>ring.map(p=>proj(p[0],p[1],z));
  const drawPts=(sp,fill,stroke,lw)=>{ ctx.beginPath();
    sp.forEach((p,i)=> i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1])); ctx.closePath();
    if(fill){ctx.fillStyle=fill;ctx.fill();}
    if(stroke){ctx.lineJoin='round';ctx.strokeStyle=stroke;ctx.lineWidth=lw||ow;ctx.stroke();} };
  const hullDraw=(pts,fill,stroke,lw)=>drawPts(convexHull(pts),fill,stroke,lw);

  ctx.save(); ctx.translate(x,y);

  /* brake glow on the tarmac + soft ground shadow */
  const bR=w*(braking?1.0:0.72);
  const tg=ctx.createRadialGradient(0,-2,2,0,-2,bR);
  tg.addColorStop(0,'rgba(226,57,46,'+(braking?0.5:0.16)+')'); tg.addColorStop(1,'rgba(226,57,46,0)');
  ctx.fillStyle=tg; ctx.beginPath(); ctx.arc(0,-2,bR,0,7); ctx.fill();
  ctx.fillStyle='rgba(20,22,18,.3)'; ctx.beginPath(); ctx.ellipse(0,4,w*0.72,w*0.12,0,0,7); ctx.fill();

  /* wheels — two small tyres peeking under the rear arches */
  ctx.fillStyle='#232327';
  [[-0.9,0.24],[0.9,0.24]].forEach(([sx,z])=>{
    const P=proj(sx,0.02,z); ctx.beginPath(); ctx.ellipse(P[0],P[1]+w*0.03,w*0.11,w*0.075,0,0,7); ctx.fill();
  });

  /* ---- rounded body: loft two rounded-rect rings (rear + front) ---- */
  const bRear=roundRectRing(-1,1,0.02,0.44,0.2), bFront=roundRectRing(-0.88,0.88,0.04,0.38,0.2);
  const bRearP=projRing(bRear,0), bFrontP=projRing(bFront,1);
  hullDraw(bRearP.concat(bFrontP), CAR_SIDE, CAR_OUTLINE, ow);            // rounded 3D shell (side tone)
  drawPts(bRearP, CAR_BODY, 'rgba(51,50,47,.28)', Math.max(1,ow*0.5));    // rear face, a touch lighter

  /* ---- greenhouse / cabin: lower domed rounded rings ---- */
  const kRear=roundRectRing(-0.78,0.78,0.4,0.84,0.28), kFront=roundRectRing(-0.6,0.6,0.4,0.72,0.26);
  const kRearP=projRing(kRear,0.18), kFrontP=projRing(kFront,0.8);
  hullDraw(kRearP.concat(kFrontP), CAR_BODY, CAR_OUTLINE, ow);

  const eps=0.004, gz=0.18+eps;                          // body-rear / glass planes
  /* tinted rear glass inset (rounded, narrower at the top) */
  const glass=roundRectRing(-0.58,0.58,0.45,0.79,0.22), glassP=projRing(glass,gz);
  drawPts(glassP, CAR_GLASS, CAR_OUTLINE, Math.max(1,ow*0.7));
  ctx.save(); ctx.beginPath(); glassP.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1])); ctx.closePath(); ctx.clip();
  ctx.fillStyle='rgba(150,175,205,.18)';
  poly([[-0.46,0.45,gz],[-0.26,0.45,gz],[0.02,0.79,gz],[-0.16,0.79,gz]]);
  ctx.restore();

  /* full-width tail-light bar with a black centre panel */
  const pc=Math.max(0.34,cosf);
  /* grey lower bumper — the two-tone break */
  const bumper=roundRectRing(-0.99,0.99,0.02,0.2,0.15);
  drawPts(projRing(bumper,eps), CAR_GREY, CAR_OUTLINE, Math.max(1,ow*0.6));
  /* thin dark garnish strip the tail lights sit on */
  poly([[-0.62,0.3,eps],[0.62,0.3,eps],[0.62,0.4,eps],[-0.62,0.4,eps]],'#26282d');

  /* round twin tail lights (FD-style), brighter under braking */
  const on=braking, red=braking?'#ff5647':'#e0392b';
  [-0.55,-0.34,0.34,0.55].forEach(cx=>{
    const P=proj(cx,0.35,eps), R=w*0.07*pc;
    ctx.fillStyle=CAR_OUTLINE; ctx.beginPath(); ctx.ellipse(P[0],P[1],R+ow*0.9,R+ow*0.9,0,0,7); ctx.fill();
    ctx.save(); if(on){ ctx.shadowColor='rgba(226,57,46,.9)'; ctx.shadowBlur=12+5*s; }
    ctx.fillStyle=red; ctx.beginPath(); ctx.ellipse(P[0],P[1],R,R,0,0,7); ctx.fill(); ctx.restore();
    ctx.fillStyle='rgba(255,255,255,.55)'; ctx.beginPath(); ctx.ellipse(P[0]-R*0.32,P[1]-R*0.32,R*0.3,R*0.3,0,0,7); ctx.fill();
  });

  /* license plate on the grey bumper — or the ML-safe decal */
  const Pp=proj(0,0.1,eps);
  if(S.mlsafe){
    ctx.fillStyle='#12331f'; rr(Pp[0]-w*0.19*pc,Pp[1]-w*0.05,w*0.38*pc,w*0.1,3); ctx.fill();
    ctx.strokeStyle=C.grn; ctx.lineWidth=Math.max(1,ow*0.7); rr(Pp[0]-w*0.19*pc,Pp[1]-w*0.05,w*0.38*pc,w*0.1,3); ctx.stroke();
    txt('ML-SAFE',Pp[0],Pp[1]+w*0.028,C.grn,Math.max(6,w*0.095*pc),'center');
  } else {
    ctx.fillStyle='#f4f3ef'; rr(Pp[0]-w*0.16*pc,Pp[1]-w*0.045,w*0.32*pc,w*0.09,2); ctx.fill();
    ctx.strokeStyle=CAR_OUTLINE; ctx.lineWidth=Math.max(1,ow*0.6); rr(Pp[0]-w*0.16*pc,Pp[1]-w*0.045,w*0.32*pc,w*0.09,2); ctx.stroke();
    ctx.fillStyle='#c7ccd6'; ctx.fillRect(Pp[0]-w*0.1*pc,Pp[1]-w*0.004,w*0.2*pc,Math.max(1,w*0.012));
  }

  /* symmetric twin chrome exhaust tips */
  [-0.42,0.42].forEach(ex=>{ const Pe=proj(ex,0.01,eps);
    ctx.fillStyle=CAR_OUTLINE; ctx.beginPath(); ctx.ellipse(Pe[0],Pe[1]+w*0.05,w*0.07*pc,w*0.045,0,0,7); ctx.fill();
    ctx.fillStyle='#cbced4'; ctx.beginPath(); ctx.ellipse(Pe[0],Pe[1]+w*0.05,w*0.048*pc,w*0.03,0,0,7); ctx.fill();
    ctx.fillStyle='#15161a'; ctx.beginPath(); ctx.ellipse(Pe[0],Pe[1]+w*0.05,w*0.026*pc,w*0.016,0,0,7); ctx.fill();
  });

  /* wing mirrors at the greenhouse shoulders */
  [-1,1].forEach(sg=>{
    const Pm=proj(sg*0.9,0.5,0.46);
    ctx.fillStyle=CAR_OUTLINE; ctx.beginPath(); ctx.ellipse(Pm[0],Pm[1],w*0.055*pc,w*0.04,0,0,7); ctx.fill();
    ctx.fillStyle='#2a2c31'; ctx.beginPath(); ctx.ellipse(Pm[0],Pm[1],w*0.04*pc,w*0.028,0,0,7); ctx.fill();
  });

  /* ---- clean roof sensor pod (grows with the sensor stack) ---- */
  const Ppod=proj(0,0.9,0.5), podw=w*0.4*pc, podh=w*0.09;
  ctx.fillStyle=CAR_BODY; rr(Ppod[0]-podw/2,Ppod[1]-podh,podw,podh,podh*0.4); ctx.fill();
  ctx.strokeStyle=CAR_OUTLINE; ctx.lineWidth=Math.max(1,ow*0.7); rr(Ppod[0]-podw/2,Ppod[1]-podh,podw,podh,podh*0.4); ctx.stroke();
  ctx.fillStyle=blink(600)?C.cyan:C.cyanD; rr(Ppod[0]-podw*0.12,Ppod[1]-podh*0.75,podw*0.24,podh*0.5,1); ctx.fill();
  if(tier>=2){ const R=w*0.075, Pd=[Ppod[0],Ppod[1]-podh-R*0.7];
    ctx.fillStyle='#e8ebf2'; ctx.beginPath(); ctx.arc(Pd[0],Pd[1],R,0,7); ctx.fill();
    ctx.strokeStyle=CAR_OUTLINE; ctx.lineWidth=Math.max(1,ow*0.7); ctx.stroke();
    ctx.fillStyle=C.mag; ctx.beginPath(); ctx.arc(Pd[0]+Math.cos(t*4)*R*0.45,Pd[1],Math.max(1.2,w*0.026),0,7); ctx.fill();
  }
  [[1,-0.32,C.cyan],[3,0.32,C.yel],[4,-0.16,C.cyan],[5,0.16,C.mag],[6,0,C.red]].forEach(([tr,fx,col])=>{
    if(tier<tr) return;
    ctx.fillStyle=blink(220)?col:'rgba(120,130,150,.6)';
    ctx.beginPath(); ctx.arc(Ppod[0]+fx*podw,Ppod[1]-podh*0.4,Math.max(1.2,w*0.02),0,7); ctx.fill();
  });

  ctx.restore();
}

/* --- particles --- */
function fx(){
  S.rings.forEach(q=>{
    const p=1-q.life/0.45, R=8+p*60;
    ctx.strokeStyle=q.c; ctx.globalAlpha=(1-p)*0.8; ctx.lineWidth=3*(1-p)+1;
    ctx.beginPath(); ctx.arc(q.x,q.y,R,0,7); ctx.stroke(); ctx.globalAlpha=1;
  });
  S.parts.forEach(q=>{
    ctx.globalAlpha=clamp(q.life*1.6,0,1);
    ctx.fillStyle=q.c; ctx.fillRect(q.x,q.y,3,3);
    ctx.globalAlpha=1;
  });
  S.pops.forEach(q=>{
    const a=clamp(q.life*1.4,0,1);
    ctx.globalAlpha=a;
    txt(q.s,q.x,q.y,q.c,18,'center','rgba(0,0,0,.9)');
    ctx.globalAlpha=1;
  });
}

/* =====================================================================
   RENDER — HUD
   ===================================================================== */
function meter(x,y,w,h,pct,cols,mark,warn,pulse,pulseC){
  /* inset glossy track */
  ctx.fillStyle=grad(x,y,x,y+h,[[0,'rgba(0,0,0,.6)'],[1,'rgba(46,54,74,.5)']]);
  rr(x,y,w,h,h/2); ctx.fill();
  ctx.strokeStyle='rgba(150,168,205,.3)'; ctx.lineWidth=1; rr(x+.5,y+.5,w-1,h-1,h/2); ctx.stroke();
  const fw=(w-4)*clamp(pct,0,1);
  if(fw>2){
    ctx.save(); rr(x+2,y+2,w-4,h-4,(h-4)/2); ctx.clip();
    ctx.fillStyle=grad(x,0,x+w,0,cols.map((c,i)=>[i/(cols.length-1),c]));
    ctx.fillRect(x+2,y+2,fw,h-4);
    ctx.fillStyle=grad(x,y,x,y+h,[[0,'rgba(255,255,255,.5)'],[0.5,'rgba(255,255,255,0)'],[1,'rgba(0,0,0,.28)']]);
    ctx.fillRect(x+2,y+2,fw,h-4);
    if(warn&&blink(120)){ ctx.fillStyle='rgba(255,255,255,.5)'; ctx.fillRect(x+2,y+2,fw,h-4); }
    ctx.restore();
    /* bright leading edge where the fill ends */
    ctx.fillStyle='rgba(255,255,255,.8)'; ctx.fillRect(x+2+fw-1.5,y+2,1.5,h-4);
  }
  if(mark>0.02){
    const mx=x+2+(w-4)*clamp(mark,0,1);
    ctx.fillStyle='rgba(235,242,255,.8)'; ctx.fillRect(mx-1,y-2,2,h+4);
  }
  /* surge pulse — flashes when an obstacle loads the pipeline */
  if(pulse>0){
    ctx.save();
    ctx.strokeStyle='rgba(255,255,255,'+(pulse*0.85).toFixed(2)+')'; ctx.lineWidth=1.5+pulse*1.5;
    rr(x-2,y-2,w+4,h+4,(h+4)/2); ctx.stroke();
    ctx.shadowColor=pulseC||'#ff5647'; ctx.shadowBlur=20*pulse;
    ctx.strokeStyle=pulseC||'#ff5647'; ctx.lineWidth=2; rr(x,y,w,h,h/2); ctx.stroke();
    ctx.restore();
  }
}
/* Minimal permanent HUD: DATA COLLECTED (big) + PIPELINE LOAD meter. */
function hud(t){
  const crit=S.load>=75&&!S.mlsafe;
  /* slim gradient top scrim so text stays readable over the world */
  ctx.fillStyle=grad(0,0,0,HUD_H+8,[[0,'rgba(6,10,14,.9)'],[1,'rgba(6,10,14,0)']]);
  ctx.fillRect(0,0,W,HUD_H+8);

  /* DATA COLLECTED — the hero metric */
  txt('DATA COLLECTED',22,24,C.dim,10);
  if(S.mlsafe) txt('· ML-SAFE',148,24,C.grn,10);
  txt(fmtData(S.mb),22,54,C.grn,26,'left','rgba(87,224,138,.5)');

  /* PIPELINE LOAD — the tension meter */
  const mw=300, mx=W-22-mw;
  txt('PIPELINE LOAD',mx,24,crit?C.warn:C.dim,10);
  txt(Math.round(S.loadShown)+'%',W-22,24,crit?C.warn:C.wht,12,'right');
  meter(mx,34,mw,16,S.loadShown/100,
        crit?['#ff9a4d','#ff5f43']:(S.load>55?['#ffb15a','#ff8a3d']:['#57e08a','#2c9c5f']),
        0, S.load>=90, S.loadPulse, S.loadPulseC);
}

function vignette(){
  const g=ctx.createRadialGradient(CX,H*0.55,H*0.28,CX,H*0.55,H*0.95);
  g.addColorStop(0,'rgba(0,0,0,0)'); g.addColorStop(1,'rgba(0,0,0,.55)');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
}
function scanlines(){
  ctx.fillStyle='rgba(0,0,0,.10)';
  for(let y=0;y<H;y+=3) ctx.fillRect(0,y,W,1);
}
/* ML-safe: a Beamr-green encoding gate the incoming data passes through */
function encodeGate(t){
  const z=0.62, s=sOf(z), y=yOf(z), hw=roadW()*s*1.02, cx=CX+cOf(z), hgt=96*s;
  const g=grad(cx,y-hgt,cx,y,[[0,'rgba(87,224,138,0)'],[1,'rgba(87,224,138,.22)']]);
  ctx.fillStyle=g; ctx.fillRect(cx-hw,y-hgt,hw*2,hgt);
  const a=0.5+0.35*Math.sin(t*4);
  ctx.fillStyle='rgba(87,224,138,'+a.toFixed(2)+')'; ctx.fillRect(cx-hw,y-Math.max(2,3*s),hw*2,Math.max(2,3*s));
  if(s>0.22) txt('BEAMR ENCODE',cx,y-hgt-6*s,C.grn,Math.max(8,12*s),'center','rgba(87,224,138,.6)');
}
function world(t){
  ctx.fillStyle='#05060c'; ctx.fillRect(0,0,W,H);
  sky(t); road(t); props();
  if(S.mlsafe) encodeGate(t);
  drawObjects(t); drawCar(t); fx();
  if(S.flash>0){ ctx.fillStyle=S.flashC; ctx.globalAlpha=clamp(S.flash*0.35,0,0.5);
                 ctx.fillRect(0,HUD_H,W,H-HUD_H); ctx.globalAlpha=1; }
  if(S.load>=75&&S.st==='play'){
    const a=0.3+0.3*Math.sin(t*7);
    ctx.strokeStyle='rgba(255,95,67,'+a.toFixed(2)+')'; ctx.lineWidth=5;
    ctx.strokeRect(3,HUD_H+3,W-6,H-HUD_H-6);
  }
  vignette(); hud(t); messages(); scanlines();
}

  ctx.fillRect(0,0,W,H);

function opt(x,y,name,sub,col,sel){
  const w=W-2*x, h=64;
  ctx.fillStyle=sel?'rgba(26,20,24,.96)':'rgba(14,16,22,.9)';
  rr(x,y,w,h,8); ctx.fill();
  ctx.strokeStyle=sel?col:'rgba(120,134,180,.28)'; ctx.lineWidth=sel?3:1;
  rr(x,y,w,h,8); ctx.stroke();
  ctx.fillStyle=col; rr(x,y,6,h,3); ctx.fill();
  txt((sel?'▸ ':'  ')+name,x+26,y+30,sel?C.wht:C.dim,18);
  txt(sub,x+26,y+50,sel?col:C.dim2,11);
}

/* the payoff reveal — big, cinematic, one idea */
function scrReveal(t){

/* the payoff: the player's actual run, then the illustrative ML-safe
   scenario, with the big figure counting down and the load bar shrinking */
function scrResult(t){
  const r=App.lastRun||{mb:0};
  const T=S.resultT;
  const keep=1-MLSAFE_REDUCTION, orig=r.mb;
  const anim=clamp((T-0.8)/1.6,0,1);
  const shown=orig-(orig*MLSAFE_REDUCTION)*anim;   // counts orig -> orig*keep
  const avoided=orig-orig*keep;
  const pct=Math.round(MLSAFE_REDUCTION*100);

  ctx.fillStyle=grad(0,0,0,H,[[0,'#06140f'],[1,'#05060c']]); ctx.fillRect(0,0,W,H);
  const gg=ctx.createRadialGradient(W/2,150,20,W/2,150,300);
  gg.addColorStop(0,'rgba(87,224,138,.14)'); gg.addColorStop(1,'rgba(87,224,138,0)');
  ctx.fillStyle=gg; ctx.fillRect(0,0,W,300);

  txtC('YOUR RUN',48,C.dim,13);
  txtC('VIDEO COLLECTED',76,C.dim,11);
  /* the hero: the number counts down from collected → ML-safe */
  txtC(fmtData(shown),140,C.grn,56,'rgba(87,224,138,.5)');
  if(anim>=1){
    txtC(fmtData(avoided)+' LESS DATA',184,C.wht,20);
    txtC(pct+'% LESS VIDEO DATA*',212,C.grn,15);
  } else {
    txtC('ENCODING…',196,C.dim,14);
  }

  /* simplified normal-variance visualization */
  const vx=W/2-210, vw=420, vy=262, vh=18;
  txt('ENCODING IMPACT',W/2,vy-10,C.wht,9,'center');
  ctx.fillStyle='rgba(4,6,14,.85)'; rr(vx,vy,vw,vh,vh/2); ctx.fill();
  const e0=vx+vw*0.24, e1=vx+vw*0.76;
  ctx.save(); rr(vx+2,vy+2,vw-4,vh-4,(vh-4)/2); ctx.clip();
  ctx.fillStyle='rgba(87,224,138,.22)'; ctx.fillRect(e0,vy,e1-e0,vh); ctx.restore();
  ctx.fillStyle='rgba(87,224,138,.6)'; ctx.fillRect(e0,vy-3,2,vh+6); ctx.fillRect(e1-2,vy-3,2,vh+6);
  txt('NORMAL MODEL VARIANCE',(e0+e1)/2,vy+vh+16,C.grn,9,'center');
  const mkx=vx+vw*0.5+(1-anim)*vw*0.3, mky=vy+vh/2;
  ctx.save(); ctx.shadowColor='rgba(87,224,138,.9)'; ctx.shadowBlur=10; ctx.fillStyle=C.wht;
  ctx.beginPath(); ctx.moveTo(mkx,mky-vh*0.7); ctx.lineTo(mkx+vh*0.55,mky); ctx.lineTo(mkx,mky+vh*0.7); ctx.lineTo(mkx-vh*0.55,mky);
  ctx.closePath(); ctx.fill(); ctx.restore();
  txtC(anim>=1?'WITHIN NORMAL VARIANCE':'MEASURING…',vy+vh+46,anim>=1?C.grn:C.dim,15);
  txtC('The encoding change is statistically indistinguishable from variation the model already tolerates.',vy+vh+68,C.dim2,9);

  txtC('Want to find your actual ML-safe range?',396,C.wht,13);
  txtC('*Illustrative '+pct+'% Beamr AV benchmark scenario. Actual ML-safe reduction depends on your video and models.',418,C.dim2,8);
  if(T>2.4&&blink(430)) txtC('PRESS SPACE',462,C.grn,14);
  scanlines();
}

function render(t){
  ctx.save();
  if(S&&S.shake>0.2){
    const sh=Math.min(S.shake,16);
    ctx.translate(rnd(-sh,sh)*0.5,rnd(-sh,sh)*0.5);
  }
  if(App.st==='title')      scrTitle(App.tT);
  else if(S.st==='choice')  scrChoice(t);
  else if(S.st==='over')    scrOver(t);
  else if(S.st==='reveal')  scrReveal(t);
  else if(S.st==='result')  scrResult(t);
  else world(t);
  ctx.restore();
}

/* =====================================================================
   FLOW + INPUT
   ===================================================================== */
const ov=document.getElementById('ov');
const pForm=document.getElementById('p-form'), pThanks=document.getElementById('p-thanks');
function showOverlay(w){
  ov.classList.add('on');
  pForm.style.display=w==='form'?'block':'none';
  pThanks.style.display=w==='thanks'?'block':'none';
  if(w==='form') setTimeout(()=>document.getElementById('f-name').focus(),60);
}
function hideOverlay(){ ov.classList.remove('on'); }
function toTitle(){ hideOverlay(); newGame(false); App.st='title'; App.tT=0; AUDIO.setMode('menu'); }
function start(){ newGame(false); App.st='play'; AUDIO.start(); AUDIO.setMode('drive'); sfx.ui(); }
function commit(){
  S.over=S.choice===0?'del':'crush'; S.st='over'; S.shake=0;
  App.best=Math.max(App.best,Math.floor(S.mb));
  App.bestCombo=Math.max(App.bestCombo,clamp(1+Math.floor(S.bestCombo/5),1,5));
  App.lastRun={mb:Math.floor(S.mb),secs:Math.floor(S.t),sensors:S.tier+1,grabbed:S.grabbed,
               hits:S.hits,pressure:S.pressureHits,nears:S.nears,maxLoad:Math.round(S.maxLoad),
               combo:clamp(1+Math.floor(S.bestCombo/5),1,5),ending:S.over};
  AUDIO.setMode('over'); sfx.dead();
}
function toReveal(){ S.st='reveal'; S.revealT=0; AUDIO.setMode('menu'); AUDIO.setIntensity(0.3); sfx.win(); }
function toResult(){ S.st='result'; S.resultT=0; AUDIO.setIntensity(0.35); }

function act(k,down){
  if(k==='ArrowLeft'||k==='a'||k==='A')  keys.left=down;
  if(k==='ArrowRight'||k==='d'||k==='D') keys.right=down;
  if(k==='ArrowUp'||k==='w'||k==='W')    keys.up=down;
  if(k==='ArrowDown'||k==='s'||k==='S')  keys.down=down;
  if(!down) return;
  AUDIO.ensure();
  if(App.st==='title'){ if(k===' '||k==='Enter') start(); return; }
  if(S.st==='mlsafe'&&(k===' '||k==='Enter')&&S.t>26){ toTitle(); return; }
  if(S.st==='choice'){
    if(k==='ArrowLeft'||k==='ArrowUp'||k==='a'){ S.choice=0; sfx.ui(); }
    else if(k==='ArrowRight'||k==='ArrowDown'||k==='d'){ S.choice=1; sfx.ui(); }
    else if(k==='1'){ S.choice=0; commit(); }
    else if(k==='2'){ S.choice=1; commit(); }
    else if(k===' '||k==='Enter') commit();
    return;
  }
  if(S.st==='over'){ if(k===' '||k==='Enter') toReveal(); return; }
  if(S.st==='reveal'){ if((k===' '||k==='Enter')&&S.revealT>3.0) toResult(); return; }
  if(S.st==='result'){ if((k===' '||k==='Enter')&&S.resultT>1.0) showOverlay('form'); return; }
}
window.addEventListener('keydown',e=>{
  if(ov.classList.contains('on')) return;
  if(e.key==='m'||e.key==='M'){ muted=!muted; AUDIO.mute(muted); return; }
  if([' ','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)) e.preventDefault();
  act(e.key,true);
});
window.addEventListener('keyup',e=>act(e.key,false));
window.addEventListener('blur',()=>{keys.left=keys.right=keys.up=keys.down=false;});

let dragging=false;
const cpos=(e)=>{ const r=cv.getBoundingClientRect(); return {x:(e.clientX-r.left)*(W/r.width),y:(e.clientY-r.top)*(H/r.height)}; };
function steerTo(x){ const cx=xOf(S.car.u,CAR_Z); keys.left=x<cx-6; keys.right=x>cx+6; }
cv.addEventListener('pointerdown',e=>{
  AUDIO.ensure(); cv.setPointerCapture?.(e.pointerId);
  const p=cpos(e);
  if(App.st==='title'){ start(); return; }
  if(S.st==='play'||S.st==='mlsafe'){
    dragging=true; steerTo(p.x);
    if(S.st==='mlsafe'&&S.t>26) toTitle();
    return;
  }
  if(S.st==='choice'){
    if(p.y>=266&&p.y<=330){ S.choice=0; commit(); }
    else if(p.y>=344&&p.y<=408){ S.choice=1; commit(); }
    return;
  }
  if(S.st==='over'){ toReveal(); return; }
  if(S.st==='reveal'){ if(S.revealT>3.0) toResult(); return; }
  if(S.st==='result'){ if(S.resultT>1.0) showOverlay('form'); return; }
});
cv.addEventListener('pointermove',e=>{ if(dragging) steerTo(cpos(e).x); });
cv.addEventListener('pointerup',()=>{dragging=false;keys.left=keys.right=false;});
cv.addEventListener('pointercancel',()=>{dragging=false;keys.left=keys.right=false;});

/* ---------- leads ----------
   HubSpot contact/property internal names this game submits. Create these
   fields on the HubSpot form (contact properties) so they map cleanly:
     firstname, lastname, email, company            (default HubSpot props)
     av_data_per_day            (dropdown)          — "DATA PER DAY"
     biggest_data_constraint    (dropdown)          — "BIGGEST DATA CONSTRAINT"
     game_data_collected_mb     (number)            — MB collected in the run
     game_run_seconds           (number)            — run length in seconds
     game_sensor_stack          (number, 1-7)       — sensors bolted on
     game_peak_load             (number, %)         — peak pipeline load
     game_mlsafe_scenario_mb    (number)            — illustrative reduced MB
     game_ending                (single-line text)  — "del" or "crush"
   The game only sends fields that exist; extra game_* props are optional. */
window.__LEADS=[];
function submitHubSpot(l){
  if(!HUBSPOT_PORTAL_ID||!HUBSPOT_FORM_GUID) return;
  const parts=(l.name||'').trim().split(/\s+/);
  const first=parts.shift()||(l.name||'');
  const last=parts.join(' ')||'-';
  const r=l.run||{};
  const map=[
    ['email',l.email],['firstname',first],['lastname',last],['company',l.company],
    ['av_data_per_day',l.volume],['biggest_data_constraint',l.constraint],
    ['game_data_collected_mb',r.mb],['game_run_seconds',r.secs],
    ['game_sensor_stack',r.sensors],['game_peak_load',r.maxLoad],
    ['game_mlsafe_scenario_mb', r.mb!=null?Math.round(r.mb*(1-MLSAFE_REDUCTION)):''],
    ['game_ending',r.ending]
  ];
  const fields=map.filter(f=>f[1]!=null&&f[1]!=='').map(f=>({name:f[0],value:String(f[1])}));
  const body={fields,context:{pageUri:(typeof location!=='undefined'&&location.href)||'',pageName:'Pipeline Overload'}};
  const url='https://api.hsforms.com/submissions/v3/integration/submit/'+
            encodeURIComponent(HUBSPOT_PORTAL_ID)+'/'+encodeURIComponent(HUBSPOT_FORM_GUID);
  fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}).catch(()=>{});
}
function submitLead(l){
  window.__LEADS.push(l);
  submitHubSpot(l);
  if(LEAD_ENDPOINT) fetch(LEAD_ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(l)}).catch(()=>{});
  if(window.dataLayer) window.dataLayer.push({event:'pipeline_overload_lead',...l});
}
document.getElementById('f-go').addEventListener('click',()=>{
  const name=document.getElementById('f-name').value.trim();
  const mail=document.getElementById('f-mail').value.trim();
  const co=document.getElementById('f-co').value.trim();
  const err=document.getElementById('f-err');
  if(!name){ err.textContent='Please add your name'; return; }
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(mail)){ err.textContent='Enter a valid work email'; return; }
  err.textContent='';
  submitLead({name,email:mail,company:co,
    volume:document.getElementById('f-vol').value,
    constraint:document.getElementById('f-constraint').value,
    run:App.lastRun,ts:new Date().toISOString(),src:'pipeline-overload'});
  const r=App.lastRun||{mb:0,secs:0,sensors:1,maxLoad:0};
  const pct=Math.round(MLSAFE_REDUCTION*100);
  const reduced=Math.round(r.mb*(1-MLSAFE_REDUCTION)), avoided=r.mb-reduced;
  document.getElementById('t-recap').innerHTML=
    'Video collected &nbsp;<b>'+fmtData(r.mb)+'</b><br>'+
    'ML-safe scenario &nbsp;<b>'+fmtData(reduced)+'</b><br>'+
    'Less data &nbsp;<b style="color:#57e08a">'+fmtData(avoided)+' ('+pct+'%)</b>'+
    '<br><span style="color:#5a6480">*Illustrative '+pct+'% Beamr AV benchmark scenario. Actual ML-safe reduction depends on your video and models.</span>';
  showOverlay('thanks'); sfx.win();
});
document.getElementById('f-skip').addEventListener('click',toTitle);
document.getElementById('t-blueprint').addEventListener('click',()=>{
  if(BLUEPRINT_URL) window.open(BLUEPRINT_URL,'_blank','noopener');
});
document.getElementById('t-go').addEventListener('click',()=>{ hideOverlay(); newGame(true); App.st='play'; AUDIO.setMode('mlsafe'); sfx.ui(); });
document.getElementById('t-replay').addEventListener('click',toTitle);

/* ---------- loop ---------- */
newGame(false);
let last=performance.now();
function loop(now){
  let dt=(now-last)/1000; last=now;
  if(dt>0.08) dt=0.08;
  if(!ov.classList.contains('on')) update(dt);
  render(now/1000);
  requestAnimationFrame(loop);
}
if(document.fonts&&document.fonts.load){
  document.fonts.load("16px PS2P").catch(()=>{}).finally(()=>requestAnimationFrame(loop));
}else requestAnimationFrame(loop);
</script>
