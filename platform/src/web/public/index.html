<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Beamr · Contact-Based Marketing Engine</title>
<meta name="robots" content="noindex, nofollow" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%2307071c'/><text y='71' x='50' text-anchor='middle' font-size='62' font-family='Inter,sans-serif' font-weight='800' fill='%2300d46a'>b</text></svg>" />
<style>
/* ============================================================
   Design tokens — shared with the Beamr OKR dashboard
   ============================================================ */
:root {
  color-scheme: dark;
  --bg: #07071c;
  --bg-grad: radial-gradient(1200px 600px at 15% -10%, rgba(0,212,106,.07), transparent 60%),
             radial-gradient(1000px 500px at 100% 0%, rgba(108,92,231,.10), transparent 55%);
  --surface: #0f1029;
  --surface-2: #15173a;
  --surface-hover: #1a1c46;
  --border: rgba(255,255,255,.08);
  --border-strong: rgba(255,255,255,.14);
  --text: #f5f5fb;
  --text-secondary: #a2a2c0;
  --text-muted: #6f6f8f;
  --accent: #00d46a;
  --accent-2: #6c5ce7;
  --st-good: #16c784; --st-warn: #f5b301; --st-crit: #ef4d4d; --st-info: #3d8bfd; --st-muted: #6f6f8f;
  --st-good-bg: rgba(22,199,132,.14); --st-warn-bg: rgba(245,179,1,.14);
  --st-crit-bg: rgba(239,77,77,.14); --st-info-bg: rgba(61,139,253,.14); --st-muted-bg: rgba(111,111,143,.16);
  --grid: rgba(255,255,255,.07);
  --axis: rgba(255,255,255,.16);
  --radius-sm: 10px; --radius: 16px; --radius-lg: 22px;
  --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --mono: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, monospace;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 12px 40px -12px rgba(0,0,0,.5);
}
:root[data-theme="light"] {
  color-scheme: light;
  --bg: #f4f5fb;
  --bg-grad: radial-gradient(1200px 600px at 15% -10%, rgba(0,212,106,.10), transparent 60%),
             radial-gradient(1000px 500px at 100% 0%, rgba(108,92,231,.10), transparent 55%);
  --surface: #fff; --surface-2: #f7f8fc; --surface-hover: #eef0f8;
  --border: rgba(15,16,41,.10); --border-strong: rgba(15,16,41,.16);
  --text: #12122b; --text-secondary: #4d4d6b; --text-muted: #8a8aa3;
  --accent: #00a352;
  --st-good: #0ca35a; --st-warn: #d9930a; --st-crit: #d83a3a; --st-info: #2d6fd6;
  --grid: rgba(15,16,41,.07); --axis: rgba(15,16,41,.18);
  --shadow: 0 1px 2px rgba(15,16,41,.06), 0 16px 40px -18px rgba(15,16,41,.22);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-text-size-adjust: 100%; }
body {
  font-family: var(--font); background: var(--bg); background-image: var(--bg-grad);
  background-attachment: fixed; color: var(--text); font-size: 14px; line-height: 1.55;
  -webkit-font-smoothing: antialiased; min-height: 100vh;
}
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
button, input, select, textarea { font: inherit; color: inherit; }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 6px; }
::-webkit-scrollbar-track { background: transparent; }

/* ---------------------------------------------------------- shell */
.shell { display: grid; grid-template-columns: 232px 1fr; min-height: 100vh; }
.sidebar {
  border-right: 1px solid var(--border); background: rgba(15,16,41,.55);
  backdrop-filter: blur(12px); padding: 22px 14px; position: sticky; top: 0;
  height: 100vh; display: flex; flex-direction: column; gap: 4px; overflow-y: auto;
}
.brand { display: flex; align-items: center; gap: 9px; padding: 0 10px 18px; }
.brand-mark {
  width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center;
  background: linear-gradient(135deg, var(--accent), #00a352); color: #04120a;
  font-weight: 800; font-size: 15px;
}
.brand-text { font-weight: 700; letter-spacing: -.02em; font-size: 14px; }
.brand-text small { display: block; font-weight: 500; font-size: 10.5px; color: var(--text-muted); letter-spacing: 0; }
.nav-label {
  font-size: 10px; text-transform: uppercase; letter-spacing: .09em; color: var(--text-muted);
  padding: 14px 10px 6px; font-weight: 600;
}
.nav-item {
  display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: var(--radius-sm);
  color: var(--text-secondary); cursor: pointer; font-size: 13px; font-weight: 500;
  border: 1px solid transparent; width: 100%; background: none; text-align: left;
}
.nav-item:hover { background: var(--surface-hover); color: var(--text); }
.nav-item.active { background: var(--surface-2); color: var(--text); border-color: var(--border); font-weight: 600; }
.nav-item .ico { width: 16px; text-align: center; opacity: .85; font-size: 13px; }
.nav-item .badge {
  margin-left: auto; background: var(--st-crit); color: #fff; font-size: 10px; font-weight: 700;
  padding: 1px 6px; border-radius: 20px; min-width: 18px; text-align: center;
}
.sidebar-foot { margin-top: auto; padding-top: 14px; border-top: 1px solid var(--border); }
.mode-pill {
  display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--text-muted);
  padding: 6px 10px; border-radius: 8px; background: var(--surface-2); margin-bottom: 6px;
}
.dot { width: 6px; height: 6px; border-radius: 50%; background: var(--st-warn); flex: none; }
.dot.live { background: var(--st-good); }

.main { min-width: 0; display: flex; flex-direction: column; }
.topbar {
  display: flex; align-items: center; gap: 14px; padding: 16px 28px;
  border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 20;
  background: rgba(7,7,28,.82); backdrop-filter: blur(12px);
}
:root[data-theme="light"] .topbar { background: rgba(244,245,251,.85); }
.topbar h1 { font-size: 17px; font-weight: 700; letter-spacing: -.02em; }
.topbar .sub { font-size: 12px; color: var(--text-muted); }
.topbar-actions { margin-left: auto; display: flex; align-items: center; gap: 8px; }
.content { padding: 24px 28px 60px; max-width: 1500px; width: 100%; }

/* ---------------------------------------------------------- atoms */
.btn {
  display: inline-flex; align-items: center; gap: 6px; padding: 7px 13px; border-radius: 9px;
  border: 1px solid var(--border-strong); background: var(--surface-2); color: var(--text);
  font-size: 12.5px; font-weight: 600; cursor: pointer; white-space: nowrap;
  transition: background .12s, border-color .12s, transform .06s;
}
.btn:hover { background: var(--surface-hover); }
.btn:active { transform: translateY(1px); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #04120a; }
.btn.primary:hover { filter: brightness(1.08); }
.btn.ghost { background: transparent; border-color: var(--border); color: var(--text-secondary); }
.btn.ghost:hover { color: var(--text); }
.btn.danger { color: var(--st-crit); border-color: rgba(239,77,77,.35); background: var(--st-crit-bg); }
.btn.sm { padding: 4px 9px; font-size: 11.5px; border-radius: 7px; }
.btn.icon { padding: 7px 9px; }

.card {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  box-shadow: var(--shadow); overflow: hidden;
}
.card-head {
  display: flex; align-items: center; gap: 10px; padding: 15px 18px;
  border-bottom: 1px solid var(--border);
}
.card-head h3 { font-size: 13.5px; font-weight: 650; letter-spacing: -.01em; }
.card-head .hint { font-size: 11.5px; color: var(--text-muted); font-weight: 400; }
.card-head .spacer { margin-left: auto; }
.card-body { padding: 18px; }
.card-body.flush { padding: 0; }

.grid { display: grid; gap: 16px; }
.g2 { grid-template-columns: repeat(2, minmax(0,1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0,1fr)); }
.g4 { grid-template-columns: repeat(4, minmax(0,1fr)); }
.g-2-1 { grid-template-columns: 2fr 1fr; }
.g-1-2 { grid-template-columns: 1fr 2fr; }
@media (max-width: 1180px) { .g4 { grid-template-columns: repeat(2, minmax(0,1fr)); }
  .g3, .g-2-1, .g-1-2 { grid-template-columns: 1fr; } }
@media (max-width: 820px) {
  .shell { grid-template-columns: 1fr; }
  .sidebar { position: static; height: auto; flex-direction: row; overflow-x: auto; padding: 10px; }
  .brand, .nav-label, .sidebar-foot { display: none; }
  .g2, .g4 { grid-template-columns: 1fr; }
  .content, .topbar { padding-left: 16px; padding-right: 16px; }
}

/* KPI tile */
.kpi { padding: 16px 18px; }
.kpi .label { font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--text-muted); font-weight: 600; }
.kpi .value { font-size: 27px; font-weight: 750; letter-spacing: -.03em; margin: 7px 0 3px; font-variant-numeric: tabular-nums; }
.kpi .value small { font-size: 14px; font-weight: 600; color: var(--text-muted); margin-left: 3px; }
.kpi .meta { font-size: 11.5px; color: var(--text-secondary); display: flex; align-items: center; gap: 6px; }

.tag {
  display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 20px;
  font-size: 10.5px; font-weight: 650; letter-spacing: .01em; white-space: nowrap;
  background: var(--st-muted-bg); color: var(--st-muted);
}
.tag.good { background: var(--st-good-bg); color: var(--st-good); }
.tag.warn { background: var(--st-warn-bg); color: var(--st-warn); }
.tag.crit { background: var(--st-crit-bg); color: var(--st-crit); }
.tag.info { background: var(--st-info-bg); color: var(--st-info); }
.tag.accent { background: rgba(0,212,106,.14); color: var(--accent); }

.grade { width: 21px; height: 21px; border-radius: 6px; display: inline-grid; place-items: center;
  font-size: 10.5px; font-weight: 750; flex: none; }
.grade.A { background: var(--st-good-bg); color: var(--st-good); }
.grade.B { background: var(--st-info-bg); color: var(--st-info); }
.grade.C { background: var(--st-warn-bg); color: var(--st-warn); }
.grade.D { background: var(--st-muted-bg); color: var(--st-muted); }

/* tables */
table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
th {
  text-align: left; font-size: 10.5px; text-transform: uppercase; letter-spacing: .06em;
  color: var(--text-muted); font-weight: 600; padding: 10px 14px;
  border-bottom: 1px solid var(--border); white-space: nowrap; background: var(--surface-2);
  position: sticky; top: 0; z-index: 1;
}
td { padding: 10px 14px; border-bottom: 1px solid var(--border); vertical-align: middle; }
tbody tr:last-child td { border-bottom: none; }
tbody tr.clickable { cursor: pointer; }
tbody tr.clickable:hover { background: var(--surface-2); }
.num { text-align: right; font-variant-numeric: tabular-nums; }
.table-wrap { overflow-x: auto; max-height: 640px; overflow-y: auto; }
.nowrap { white-space: nowrap; }
.trunc { max-width: 260px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* forms */
label.field { display: block; margin-bottom: 12px; }
label.field > span {
  display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .06em;
  color: var(--text-muted); font-weight: 600; margin-bottom: 5px;
}
input[type=text], input[type=email], input[type=number], input[type=url], select, textarea {
  width: 100%; padding: 8px 11px; border-radius: 9px; border: 1px solid var(--border-strong);
  background: var(--bg); color: var(--text); font-size: 13px; outline: none;
}
input:focus, select:focus, textarea:focus { border-color: var(--accent); }
textarea { resize: vertical; min-height: 88px; font-family: var(--mono); font-size: 12px; line-height: 1.6; }
.help { font-size: 11.5px; color: var(--text-muted); margin-top: 4px; }
.row-inline { display: flex; gap: 10px; align-items: flex-end; flex-wrap: wrap; }
.row-inline > * { flex: 1; min-width: 150px; }
.row-inline > .fixed { flex: none; min-width: 0; }

.empty { padding: 44px 20px; text-align: center; color: var(--text-muted); font-size: 13px; }
.empty .big { font-size: 26px; margin-bottom: 8px; opacity: .5; }

.bar { height: 6px; border-radius: 4px; background: var(--surface-2); overflow: hidden; min-width: 60px; }
.bar > i { display: block; height: 100%; border-radius: 4px; background: var(--accent); }

/* funnel */
.funnel-step { display: flex; align-items: center; gap: 12px; padding: 9px 0; }
.funnel-step .name { font-size: 12.5px; width: 210px; flex: none; color: var(--text-secondary); }
.funnel-step .track { flex: 1; height: 26px; background: var(--surface-2); border-radius: 7px; overflow: hidden; }
.funnel-step .fill {
  height: 100%; border-radius: 7px; display: flex; align-items: center; padding: 0 9px;
  font-size: 11.5px; font-weight: 650; color: #04120a; min-width: 30px;
  background: linear-gradient(90deg, var(--accent), #00a352);
}
.funnel-step .drop { font-size: 11px; color: var(--text-muted); width: 54px; text-align: right; flex: none; }

/* timeline */
.tl { position: relative; padding-left: 22px; }
.tl::before { content: ''; position: absolute; left: 5px; top: 6px; bottom: 6px; width: 1px; background: var(--border); }
.tl-item { position: relative; padding: 7px 0; }
.tl-item::before {
  content: ''; position: absolute; left: -21px; top: 13px; width: 9px; height: 9px;
  border-radius: 50%; background: var(--st-muted); border: 2px solid var(--surface);
}
.tl-item.web::before { background: var(--st-info); }
.tl-item.email::before { background: var(--accent); }
.tl-item.linkedin::before { background: var(--accent-2); }
.tl-item.system::before { background: var(--st-muted); }
.tl-item .t { font-size: 12.5px; font-weight: 550; }
.tl-item .m { font-size: 11.5px; color: var(--text-muted); }

/* drawer */
.drawer-back {
  position: fixed; inset: 0; background: rgba(3,3,14,.62); backdrop-filter: blur(3px);
  z-index: 60; opacity: 0; pointer-events: none; transition: opacity .16s;
}
.drawer-back.open { opacity: 1; pointer-events: auto; }
.drawer {
  position: fixed; top: 0; right: 0; bottom: 0; width: min(680px, 96vw); z-index: 61;
  background: var(--surface); border-left: 1px solid var(--border); overflow-y: auto;
  transform: translateX(100%); transition: transform .2s cubic-bezier(.3,.9,.4,1);
  box-shadow: -20px 0 60px -20px rgba(0,0,0,.7);
}
.drawer.open { transform: none; }
.drawer-head {
  display: flex; align-items: flex-start; gap: 12px; padding: 20px;
  border-bottom: 1px solid var(--border); position: sticky; top: 0;
  background: var(--surface); z-index: 2;
}
.drawer-head h2 { font-size: 17px; font-weight: 700; letter-spacing: -.02em; }
.drawer-head .sub { font-size: 12.5px; color: var(--text-muted); margin-top: 2px; }
.drawer-body { padding: 20px; }
.section-title {
  font-size: 10.5px; text-transform: uppercase; letter-spacing: .08em; color: var(--text-muted);
  font-weight: 650; margin: 22px 0 10px; padding-bottom: 6px; border-bottom: 1px solid var(--border);
}
.section-title:first-child { margin-top: 0; }
.kv { display: grid; grid-template-columns: 128px 1fr; gap: 5px 14px; font-size: 12.5px; }
.kv dt { color: var(--text-muted); }
.kv dd { color: var(--text); word-break: break-word; }

/* modal */
.modal-back {
  position: fixed; inset: 0; background: rgba(3,3,14,.7); backdrop-filter: blur(4px);
  z-index: 80; display: grid; place-items: center; padding: 24px; overflow-y: auto;
}
.modal {
  background: var(--surface); border: 1px solid var(--border-strong); border-radius: var(--radius-lg);
  width: min(620px, 100%); box-shadow: 0 30px 90px -30px rgba(0,0,0,.85); max-height: 92vh;
  display: flex; flex-direction: column;
}
.modal.wide { width: min(880px, 100%); }
.modal-head { padding: 20px 22px 14px; border-bottom: 1px solid var(--border); }
.modal-head h2 { font-size: 16px; font-weight: 700; }
.modal-head p { font-size: 12.5px; color: var(--text-muted); margin-top: 3px; }
.modal-body { padding: 20px 22px; overflow-y: auto; }
.modal-foot {
  padding: 14px 22px; border-top: 1px solid var(--border); display: flex; gap: 9px;
  justify-content: flex-end; background: var(--surface-2);
  border-radius: 0 0 var(--radius-lg) var(--radius-lg);
}

/* chart */
.chart { width: 100%; display: block; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 11.5px; color: var(--text-secondary); }
.legend i { width: 9px; height: 9px; border-radius: 3px; display: inline-block; margin-right: 5px; }

.code {
  font-family: var(--mono); font-size: 12px; background: var(--bg); border: 1px solid var(--border);
  border-radius: 10px; padding: 13px; white-space: pre-wrap; word-break: break-all;
  color: var(--text-secondary); line-height: 1.6;
}
.toast-host { position: fixed; bottom: 22px; right: 22px; z-index: 200; display: flex; flex-direction: column; gap: 8px; }
.toast {
  background: var(--surface-2); border: 1px solid var(--border-strong); border-radius: 11px;
  padding: 11px 15px; font-size: 12.5px; box-shadow: var(--shadow); max-width: 380px;
  animation: slidein .18s ease-out;
}
.toast.err { border-color: rgba(239,77,77,.5); color: var(--st-crit); }
.toast.ok { border-color: rgba(22,199,132,.45); }
@keyframes slidein { from { opacity: 0; transform: translateX(18px); } }

.spinner {
  width: 15px; height: 15px; border: 2px solid var(--border-strong); border-top-color: var(--accent);
  border-radius: 50%; animation: spin .7s linear infinite; display: inline-block;
}
@keyframes spin { to { transform: rotate(360deg); } }

.tabs { display: flex; gap: 3px; border-bottom: 1px solid var(--border); margin-bottom: 18px; overflow-x: auto; }
.tab {
  padding: 8px 13px; font-size: 12.5px; font-weight: 550; color: var(--text-muted);
  cursor: pointer; border: none; background: none; border-bottom: 2px solid transparent;
  white-space: nowrap;
}
.tab:hover { color: var(--text); }
.tab.active { color: var(--text); border-bottom-color: var(--accent); font-weight: 650; }

.banner {
  display: flex; gap: 11px; align-items: flex-start; padding: 13px 16px; border-radius: 12px;
  background: var(--st-warn-bg); border: 1px solid rgba(245,179,1,.28); font-size: 12.5px;
  color: var(--text-secondary); margin-bottom: 18px;
}
.banner.info { background: var(--st-info-bg); border-color: rgba(61,139,253,.28); }
.banner strong { color: var(--text); }

/* login */
.login-wrap { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
.login { width: min(400px, 100%); }
.login .card-body { padding: 28px; }
.login h1 { font-size: 19px; font-weight: 750; margin-bottom: 5px; letter-spacing: -.02em; }
.login p { font-size: 12.5px; color: var(--text-muted); margin-bottom: 20px; }
.hidden { display: none !important; }
</style>
</head>
<body>
<div id="app"></div>
<div class="toast-host" id="toasts"></div>
<script type="module" src="/app.js"></script>
</body>
</html>
