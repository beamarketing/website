<title>Beamr — Broadcast Architecture Component Preview</title>
<style>
  :root {
    --bg: #07071c;
    --panel-top: #0a0a20;
    --panel-bot: #0f1029;
    --text: #ffffff;
    --muted: #8b8ba3;
    --muted2: #c2c2d6;
    --accent: #00d46a;
    --border: rgba(255, 255, 255, 0.08);
    --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  }

  * { box-sizing: border-box; }

  .ba-section {
    width: 100%;
    background: var(--bg);
    padding: 100px 48px;
    font-family: var(--font);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }
  .ba-wrap { max-width: 1160px; margin: 0 auto; }
  .ba-grid {
    display: grid;
    grid-template-columns: 0.95fr 1.05fr;
    gap: 72px;
    align-items: center;
  }

  /* ---- Header ---- */
  .ba-header { display: flex; flex-direction: column; gap: 20px; }
  .ba-eyebrow {
    font-size: 12px; font-weight: 600; color: var(--accent);
    letter-spacing: 0.1em; text-transform: uppercase;
  }
  .ba-heading {
    font-size: 42px; font-weight: 700; margin: 0; line-height: 1.12;
    letter-spacing: -0.03em; text-wrap: balance;
  }
  .ba-desc {
    font-size: 16px; color: var(--muted); margin: 0; line-height: 1.7; max-width: 460px;
  }

  /* ---- Checklist ---- */
  .ba-checklist { display: flex; flex-direction: column; gap: 12px; margin-top: 12px; }
  .ba-check { display: flex; align-items: center; gap: 12px; padding: 4px 0; }
  .ba-check.emph {
    padding: 14px 16px; border-radius: 12px;
    background: rgba(0, 212, 106, 0.08); border: 1px solid rgba(0, 212, 106, 0.28);
  }
  .ba-check-dot {
    flex-shrink: 0; width: 24px; height: 24px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    background: rgba(0, 212, 106, 0.1);
  }
  .ba-check.emph .ba-check-dot { background: rgba(0, 212, 106, 0.18); }
  .ba-check-label { font-size: 15px; font-weight: 500; color: var(--muted); letter-spacing: -0.01em; }
  .ba-check.emph .ba-check-label { font-weight: 600; color: var(--text); }

  /* ---- Pipeline panel ---- */
  .ba-panel {
    background: linear-gradient(180deg, var(--panel-top) 0%, var(--panel-bot) 100%);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 30px 28px;
    box-shadow: 0 24px 70px rgba(0, 0, 0, 0.45);
  }
  .ba-panel-bar { display: flex; align-items: center; gap: 8px; margin-bottom: 22px; }
  .ba-dots { display: flex; gap: 5px; }
  .ba-dots span { width: 9px; height: 9px; border-radius: 50%; opacity: 0.85; }
  .ba-panel-title {
    font-size: 12px; font-weight: 600; color: var(--muted);
    letter-spacing: 0.04em; text-transform: uppercase; margin-left: 4px;
  }
  .ba-stages { display: flex; flex-direction: column; }

  .ba-stage { position: relative; display: flex; gap: 16px; padding-bottom: 26px; }
  .ba-stage:last-child { padding-bottom: 0; }

  .ba-rail { position: relative; flex-shrink: 0; width: 46px; display: flex; justify-content: center; }
  .ba-connector {
    position: absolute; top: 46px; bottom: 0; left: 50%; transform: translateX(-50%);
    width: 2px; border-radius: 2px; background: rgba(255, 255, 255, 0.09); overflow: hidden;
  }
  .ba-pulse {
    position: absolute; left: 0; right: 0; height: 55%;
    background: linear-gradient(180deg, transparent, var(--accent), transparent);
    animation: ba-flow 2.6s linear infinite;
  }
  .ba-ring {
    position: absolute; top: 0; width: 46px; height: 46px; border-radius: 14px;
    border: 1px solid var(--accent); animation: ba-ring 2.6s ease-in-out infinite; pointer-events: none;
  }
  .ba-icon {
    position: relative; z-index: 1; width: 46px; height: 46px; border-radius: 14px;
    display: flex; align-items: center; justify-content: center;
    background: rgba(255, 255, 255, 0.04); border: 1px solid var(--border);
  }
  .ba-stage.hi .ba-icon {
    background: rgba(0, 212, 106, 0.12); border: 1px solid rgba(0, 212, 106, 0.5);
    box-shadow: 0 0 22px rgba(0, 212, 106, 0.25);
  }

  .ba-card {
    flex: 1; min-width: 0; display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 13px 18px; border-radius: 14px;
    background: rgba(255, 255, 255, 0.02); border: 1px solid var(--border);
    transition: transform 0.3s ease;
  }
  .ba-card:hover { transform: translateX(3px); }
  .ba-stage.hi .ba-card { background: rgba(0, 212, 106, 0.06); border: 1px solid rgba(0, 212, 106, 0.22); }
  .ba-title { font-size: 15px; font-weight: 600; color: var(--text); letter-spacing: -0.01em; line-height: 1.3; }
  .ba-sub { font-size: 12.5px; color: var(--muted); margin-top: 3px; line-height: 1.4; }
  .ba-tag {
    flex-shrink: 0; font-size: 10.5px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase;
    color: var(--muted); padding: 4px 9px; border-radius: 999px;
    background: rgba(255, 255, 255, 0.04); border: 1px solid var(--border);
  }
  .ba-stage.hi .ba-tag {
    color: var(--accent); background: rgba(0, 212, 106, 0.12); border: 1px solid rgba(0, 212, 106, 0.35);
  }

  @keyframes ba-flow {
    0%   { transform: translateY(-110%); opacity: 0; }
    20%  { opacity: 1; }
    80%  { opacity: 1; }
    100% { transform: translateY(210%); opacity: 0; }
  }
  @keyframes ba-ring {
    0%, 100% { opacity: 0.18; transform: scale(1); }
    50%      { opacity: 0.55; transform: scale(1.08); }
  }
  @media (prefers-reduced-motion: reduce) {
    .ba-pulse, .ba-ring { animation: none; }
    .ba-pulse { opacity: 0.6; }
  }

  .ba-narrow-checklist { display: none; }

  @media (max-width: 960px) {
    .ba-section { padding: 72px 32px; }
    .ba-grid { grid-template-columns: 1fr; gap: 40px; }
    .ba-heading { font-size: 36px; }
    .ba-header .ba-checklist { display: none; }
    .ba-narrow-checklist { display: flex; margin-top: 28px; }
  }
  @media (max-width: 560px) {
    .ba-section { padding: 56px 20px; }
    .ba-heading { font-size: 30px; }
    .ba-panel { padding: 24px 20px; }
  }
</style>

<section class="ba-section">
  <div class="ba-wrap">
    <div class="ba-grid">
      <!-- Header -->
      <div class="ba-header">
        <span class="ba-eyebrow">Seamless Integration</span>
        <h2 class="ba-heading">Fits Into Your Existing Broadcast Infrastructure</h2>
        <p class="ba-desc">Beamr slots into the workflow you already run. Two intelligent steps in production do the work — everything upstream and downstream stays exactly as it is.</p>
        <div class="ba-checklist" id="checklist-desktop"></div>
      </div>

      <!-- Pipeline -->
      <div class="ba-panel">
        <div class="ba-panel-bar">
          <span class="ba-dots">
            <span style="background:#ff5f56"></span>
            <span style="background:#ffbd2e"></span>
            <span style="background:#27c93f"></span>
          </span>
          <span class="ba-panel-title">Production Pipeline</span>
        </div>
        <div class="ba-stages" id="stages"></div>
      </div>
    </div>
    <div class="ba-checklist ba-narrow-checklist" id="checklist-mobile"></div>
  </div>
</section>

<script>
  const ACCENT = "#00d46a";
  const MUTED = "#c2c2d6";

  const icons = {
    camera: c => `<svg width="22" height="22" viewBox="0 0 22 22" fill="none"><rect x="2" y="6" width="12" height="10" rx="2" stroke="${c}" stroke-width="1.6"/><path d="M14 9.5L20 6.5V15.5L14 12.5V9.5Z" stroke="${c}" stroke-width="1.6" stroke-linejoin="round"/></svg>`,
    sliders: c => `<svg width="22" height="22" viewBox="0 0 22 22" fill="none"><path d="M4 6H18M4 11H18M4 16H18" stroke="${c}" stroke-width="1.6" stroke-linecap="round"/><circle cx="8" cy="6" r="2" fill="#0b0d1c" stroke="${c}" stroke-width="1.6"/><circle cx="14" cy="11" r="2" fill="#0b0d1c" stroke="${c}" stroke-width="1.6"/><circle cx="7" cy="16" r="2" fill="#0b0d1c" stroke="${c}" stroke-width="1.6"/></svg>`,
    sparkle: c => `<svg width="22" height="22" viewBox="0 0 22 22" fill="none"><path d="M11 2.5L12.6 8.2L18 10L12.6 11.8L11 17.5L9.4 11.8L4 10L9.4 8.2L11 2.5Z" stroke="${c}" stroke-width="1.5" stroke-linejoin="round"/><path d="M17.5 15L18.2 17L20 17.7L18.2 18.4L17.5 20.4L16.8 18.4L15 17.7L16.8 17L17.5 15Z" fill="${c}"/></svg>`,
    compress: c => `<svg width="22" height="22" viewBox="0 0 22 22" fill="none"><path d="M11 3V6M11 3L9 5M11 3L13 5" stroke="${c}" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M11 19V16M11 19L9 17M11 19L13 17" stroke="${c}" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><rect x="4" y="8.5" width="14" height="5" rx="1.4" stroke="${c}" stroke-width="1.6"/></svg>`,
    cloud: c => `<svg width="22" height="22" viewBox="0 0 22 22" fill="none"><path d="M6.5 16C4 16 2.5 14.3 2.5 12.2C2.5 10.3 3.9 8.7 5.8 8.5C6.3 6 8.4 4.2 11 4.2C13.9 4.2 16.2 6.4 16.4 9.2C18.1 9.5 19.3 10.9 19.3 12.6C19.3 14.5 17.8 16 15.9 16H6.5Z" stroke="${c}" stroke-width="1.6" stroke-linejoin="round"/></svg>`,
    viewers: c => `<svg width="22" height="22" viewBox="0 0 22 22" fill="none"><rect x="2.5" y="4" width="17" height="11" rx="2" stroke="${c}" stroke-width="1.6"/><path d="M9.5 7.7L13 9.5L9.5 11.3V7.7Z" fill="${c}"/><path d="M7.5 18.5H14.5" stroke="${c}" stroke-width="1.6" stroke-linecap="round"/></svg>`
  };
  const checkIcon = c => `<svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M2.8 7.2L5.6 10L11.2 4" stroke="${c}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
  const sparkIcon = c => `<svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M7 1.5L8 5L11.5 6L8 7L7 10.5L6 7L2.5 6L6 5L7 1.5Z" fill="${c}"/></svg>`;

  const stages = [
    { icon: "camera", title: "HD Camera Feed", subtitle: "Your existing capture", tag: "", hi: false },
    { icon: "sliders", title: "Production Switching", subtitle: "Live gallery &amp; vision mixing", tag: "", hi: false },
    { icon: "sparkle", title: "NVIDIA RTX Video Super Resolution", subtitle: "AI upscaling to pristine detail", tag: "Enhance", hi: true },
    { icon: "compress", title: "Beamr CABR Encoding", subtitle: "Content-adaptive bitrate reduction", tag: "Optimize", hi: true },
    { icon: "cloud", title: "Packaging &amp; CDN", subtitle: "Your current delivery stack", tag: "", hi: false },
    { icon: "viewers", title: "Viewers", subtitle: "No player changes required", tag: "", hi: false }
  ];

  const reassurances = [
    { text: "No new cameras", emphasis: false },
    { text: "No new delivery infrastructure", emphasis: false },
    { text: "No player changes", emphasis: false },
    { text: "Just a smarter production pipeline", emphasis: true }
  ];

  document.getElementById("stages").innerHTML = stages.map((s, i) => {
    const last = i === stages.length - 1;
    const iconColor = s.hi ? ACCENT : MUTED;
    return `
      <div class="ba-stage ${s.hi ? "hi" : ""}">
        <div class="ba-rail">
          ${last ? "" : `<div class="ba-connector"><div class="ba-pulse" style="animation-delay:${i * 0.35}s"></div></div>`}
          ${s.hi ? `<div class="ba-ring" style="animation-delay:${i * 0.2}s"></div>` : ""}
          <div class="ba-icon">${icons[s.icon](iconColor)}</div>
        </div>
        <div class="ba-card">
          <div>
            <div class="ba-title">${s.title}</div>
            ${s.subtitle ? `<div class="ba-sub">${s.subtitle}</div>` : ""}
          </div>
          ${s.tag ? `<span class="ba-tag">${s.tag}</span>` : ""}
        </div>
      </div>`;
  }).join("");

  const checklistHTML = reassurances.map(r => `
    <div class="ba-check ${r.emphasis ? "emph" : ""}">
      <span class="ba-check-dot">${r.emphasis ? sparkIcon(ACCENT) : checkIcon(ACCENT)}</span>
      <span class="ba-check-label">${r.text}</span>
    </div>`).join("");
  document.getElementById("checklist-desktop").innerHTML = checklistHTML;
  document.getElementById("checklist-mobile").innerHTML = checklistHTML;
</script>
