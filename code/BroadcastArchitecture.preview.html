<title>Beamr — Broadcast Integration Figure</title>
<style>
  :root {
    --bg: #ffffff;
    --text: #111827;
    --secondary: #6b7280;
    --light: #9ca3af;
    --primary: #4F46E5;
    --border: #e5e7eb;
    --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    --ease: cubic-bezier(0.16, 1, 0.3, 1);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); }

  .ba { width: 100%; background: var(--bg); padding: 100px 32px; font-family: var(--font); color: var(--text); -webkit-font-smoothing: antialiased; }
  .ba-wrap { max-width: 1120px; margin: 0 auto; }

  /* header */
  .ba-head { max-width: 720px; margin-bottom: 56px; }
  .ba-eyebrow { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; color: var(--primary); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 18px; }
  .ba-eyebrow i { width: 6px; height: 6px; border-radius: 50%; background: var(--primary); display: inline-block; }
  .ba-h { font-size: 42px; font-weight: 800; line-height: 1.1; letter-spacing: -0.03em; color: var(--text); text-wrap: balance; }
  .ba-sub { font-size: 17px; color: var(--secondary); margin-top: 18px; line-height: 1.65; max-width: 580px; }

  /* flow */
  .ba-flow { display: flex; align-items: stretch; }
  .ba-item { display: flex; flex: 1 1 0; min-width: 0; }
  .ba-card {
    flex: 1 1 0; min-width: 0; background: var(--bg); border: 1px solid var(--border); border-radius: 14px;
    padding: 20px 18px; display: flex; flex-direction: column; align-items: flex-start; gap: 14px;
    transition: transform 0.35s var(--ease), box-shadow 0.35s ease, border-color 0.35s ease;
  }
  .ba-card:hover { transform: translateY(-4px); box-shadow: 0 16px 40px rgba(0,0,0,0.06); }
  .ba-card.hi { border-color: rgba(79,70,229,0.35); }
  .ba-ic { width: 44px; height: 44px; border-radius: 12px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; background: rgba(17,24,39,0.04); }
  .ba-card.hi .ba-ic { background: rgba(79,70,229,0.08); }
  .ba-kick { font-size: 10.5px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--light); margin-bottom: 5px; }
  .ba-card.hi .ba-kick { color: var(--primary); }
  .ba-name { font-size: 14.5px; font-weight: 600; color: var(--text); line-height: 1.35; letter-spacing: -0.01em; }

  .ba-conn { flex-shrink: 0; width: 34px; display: flex; align-items: center; justify-content: center; color: var(--light); }

  /* indigo layer */
  .ba-layer { position: relative; background: rgba(79,70,229,0.04); border: 1px solid rgba(79,70,229,0.14); border-radius: 18px; padding: 14px 14px 16px; }
  .ba-layer-tab { position: absolute; top: -10px; left: 16px; font-size: 10.5px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--primary); background: var(--bg); padding: 0 8px; }
  .ba-layer-row { display: flex; align-items: stretch; gap: 12px; }

  .ba-caption { margin-top: 18px; font-size: 13.5px; color: var(--light); }

  /* closer */
  .ba-closer { margin-top: 56px; padding-top: 32px; border-top: 1px solid var(--border); display: flex; align-items: baseline; justify-content: space-between; gap: 40px; }
  .ba-reassure { font-size: 18px; font-weight: 500; color: var(--secondary); line-height: 1.5; }
  .ba-reassure .sep { color: var(--border); }
  .ba-punch { flex-shrink: 0; font-size: 22px; font-weight: 700; color: var(--text); letter-spacing: -0.02em; line-height: 1.3; }

  /* reveal */
  .rv { opacity: 0; transform: translateY(24px); transition: opacity 0.7s var(--ease), transform 0.7s var(--ease); }
  .rv.in { opacity: 1; transform: translateY(0); }

  @media (max-width: 860px) {
    .ba { padding: 64px 22px; }
    .ba-h { font-size: 30px; }
    .ba-head { margin-bottom: 40px; }
    .ba-flow { flex-direction: column; }
    .ba-item { flex: none; }
    .ba-card { flex-direction: row; align-items: center; }
    .ba-conn { width: 100%; height: 24px; justify-content: flex-start; margin-left: 22px; }
    .ba-conn svg { transform: rotate(90deg); }
    .ba-layer { padding: 34px 12px 12px; }
    .ba-layer-tab { top: 12px; left: 14px; background: transparent; padding: 0; }
    .ba-layer-row { flex-direction: column; }
    .ba-closer { flex-direction: column; align-items: flex-start; gap: 12px; margin-top: 40px; }
    .ba-punch { font-size: 20px; }
  }
</style>

<section class="ba">
  <div class="ba-wrap">
    <div class="ba-head rv">
      <h2 class="ba-h">Fits into your existing broadcast infrastructure</h2>
      <p class="ba-sub">Two intelligent steps drop into production. Everything upstream and downstream stays exactly as it is — the same signal chain you already run.</p>
    </div>

    <div class="ba-flow" id="flow"></div>
    <p class="ba-caption rv">The smart production layer — the only two steps you add</p>

    <div class="ba-closer rv">
      <div class="ba-reassure" id="reassure"></div>
      <div class="ba-punch">Just a smarter production pipeline.</div>
    </div>
  </div>
</section>

<script>
  const PRIMARY = "#4F46E5", SECONDARY = "#6b7280";
  const chevron = `<svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M4 2L10 8L4 14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
  const icons = {
    camera: c => `<svg width="22" height="22" viewBox="0 0 24 24" fill="none"><rect x="2.5" y="7" width="13" height="10" rx="2" stroke="${c}" stroke-width="1.6"/><path d="M15.5 10.5L21.5 7.5V16.5L15.5 13.5V10.5Z" stroke="${c}" stroke-width="1.6" stroke-linejoin="round"/></svg>`,
    sliders: c => `<svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M4 7H20M4 12H20M4 17H20" stroke="${c}" stroke-width="1.6" stroke-linecap="round"/><circle cx="9" cy="7" r="2.4" stroke="${c}" stroke-width="1.6"/><circle cx="15" cy="12" r="2.4" stroke="${c}" stroke-width="1.6"/><circle cx="8" cy="17" r="2.4" stroke="${c}" stroke-width="1.6"/></svg>`,
    sparkle: c => `<svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M12 3L13.8 9L19.5 10.8L13.8 12.6L12 18.5L10.2 12.6L4.5 10.8L10.2 9L12 3Z" stroke="${c}" stroke-width="1.5" stroke-linejoin="round"/><path d="M19 16L19.7 18L21.5 18.7L19.7 19.4L19 21.3L18.3 19.4L16.5 18.7L18.3 18L19 16Z" fill="${c}"/></svg>`,
    compress: c => `<svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M12 3V6.5M12 3L10 5M12 3L14 5" stroke="${c}" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M12 21V17.5M12 21L10 19M12 21L14 19" stroke="${c}" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><rect x="4.5" y="9.5" width="15" height="5" rx="1.4" stroke="${c}" stroke-width="1.6"/></svg>`,
    cloud: c => `<svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M7 17.5C4.5 17.5 3 15.8 3 13.7C3 11.8 4.4 10.2 6.3 10C6.8 7.5 8.9 5.7 11.5 5.7C14.4 5.7 16.7 7.9 16.9 10.7C18.6 11 19.8 12.4 19.8 14.1C19.8 16 18.3 17.5 16.4 17.5H7Z" stroke="${c}" stroke-width="1.6" stroke-linejoin="round"/></svg>`,
    viewers: c => `<svg width="22" height="22" viewBox="0 0 24 24" fill="none"><rect x="3" y="4.5" width="18" height="12" rx="2" stroke="${c}" stroke-width="1.6"/><path d="M10.5 8.5L14 10.5L10.5 12.5V8.5Z" fill="${c}"/><path d="M8.5 20H15.5" stroke="${c}" stroke-width="1.6" stroke-linecap="round"/></svg>`
  };

  const stages = [
    { icon: "camera",   name: "HD Camera Feed", kicker: "Capture", hi: false },
    { icon: "sliders",  name: "Production Switching", kicker: "Live mix", hi: false },
    { icon: "sparkle",  name: "NVIDIA RTX Video Super Resolution", kicker: "AI upscale", hi: true },
    { icon: "compress", name: "Beamr CABR Encoding", kicker: "Optimize bitrate", hi: true },
    { icon: "cloud",    name: "Packaging &amp; CDN", kicker: "Deliver", hi: false },
    { icon: "viewers",  name: "Viewers", kicker: "Playback", hi: false }
  ];
  const reassurances = ["No new cameras", "No new delivery infrastructure", "No player changes"];

  function cardHTML(s, i) {
    const col = s.hi ? PRIMARY : SECONDARY;
    return `
      <div class="ba-card ${s.hi ? "hi" : ""}">
        <div class="ba-ic">${icons[s.icon](col)}</div>
        <div style="min-width:0">
          <div class="ba-kick">${String(i+1).padStart(2,"0")} · ${s.kicker}</div>
          <div class="ba-name">${s.name}</div>
        </div>
      </div>`;
  }
  const conn = `<div class="ba-conn">${chevron}</div>`;

  const hiIdx = stages.map((s,i)=> s.hi ? i : -1).filter(i=>i>=0);
  const firstHi = hiIdx[0], lastHi = hiIdx[hiIdx.length-1];

  let html = "", i = 0;
  while (i < stages.length) {
    if (i === firstHi) {
      if (html) html += conn;
      let inner = "";
      for (let k = firstHi; k <= lastHi; k++) {
        inner += `<div class="ba-item">${cardHTML(stages[k], k)}</div>`;
        if (k < lastHi) inner += conn;
      }
      html += `<div class="ba-item" style="flex:${lastHi-firstHi+1} 1 0"><div class="ba-layer" style="flex:1 1 0"><span class="ba-layer-tab">Added by Beamr</span><div class="ba-layer-row">${inner}</div></div></div>`;
      i = lastHi + 1;
    } else {
      if (html) html += conn;
      html += `<div class="ba-item">${cardHTML(stages[i], i)}</div>`;
      i++;
    }
  }
  document.getElementById("flow").innerHTML = html;

  document.getElementById("reassure").innerHTML = reassurances.map((r,k)=>
    r + (k < reassurances.length-1 ? `<span class="sep">&nbsp;&nbsp;/&nbsp;&nbsp;</span>` : ".")
  ).join("");

  // staggered reveal
  const items = [document.querySelector(".ba-head"), ...document.querySelectorAll("#flow .ba-item"), document.querySelector(".ba-caption"), document.querySelector(".ba-closer")];
  document.querySelectorAll("#flow .ba-item").forEach(el => el.classList.add("rv"));
  const io = new IntersectionObserver((entries)=>{
    entries.forEach(e=>{ if(e.isIntersecting){ items.forEach((el,idx)=>{ if(el){ el.style.transitionDelay = (idx*0.07)+"s"; el.classList.add("in"); }}); io.disconnect(); }});
  }, { threshold: 0.12 });
  io.observe(document.querySelector(".ba-wrap"));
</script>
